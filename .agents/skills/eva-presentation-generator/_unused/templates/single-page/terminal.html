<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><title>Terminal</title>
<link href="../../assets/fonts.css" rel="stylesheet"/>
<link href="../../assets/base.css" rel="stylesheet"/>
<link href="../../assets/themes/terminal-green.css" id="theme-link" rel="stylesheet"/>
<link href="../../assets/animations/animations.css" rel="stylesheet"/>
<style>
.term{font-family:var(--font-mono);font-size:16px;background:#020803;border:1px solid rgba(0,255,120,.3);border-radius:10px;padding:24px 28px;box-shadow:0 0 60px rgba(0,255,136,.08) inset}
.term .bar{display:flex;gap:6px;margin-bottom:16px}
.term .bar span{width:12px;height:12px;border-radius:50%;background:#222;border:1px solid rgba(0,255,136,.3)}
.term .p{color:var(--accent)}
.term .c{color:var(--text-1)}
.term .o{color:var(--text-2)}
.term .caret{display:inline-block;width:9px;height:18px;background:var(--accent);vertical-align:middle;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head><body class="single">
<div class="deck"><section class="slide is-active" data-title="Terminal">
<header class="slide-header">
  <span class="overline">{{ part_label }}</span>
  <h1 class="page-title">{{ title }}</h1>
</header>
<div class="term mt-l" style="padding:0; overflow:hidden">
<div class="bar" style="display:flex; align-items:center; gap:6px; padding:12px 16px; background:rgba(0,0,0,0.1); border-bottom:1px solid rgba(0,255,120,.2); margin:0">
  <span style="background:#FF5F57; border:none"></span>
  <span style="background:#FFBD2E; border:none"></span>
  <span style="background:#28CA41; border:none"></span>
</div>
<div style="padding:24px 28px">
<div><span class="p">TEXTO </span><span class="c">{{ text }}</span></div>
<div class="o">  TEXTO</div>
<div class="o">  TEXTO</div>
<div class="o">  TEXTO</div>
<div style="margin-top:12px"><span class="p">TEXTO </span><span class="c">{{ text }}</span></div>
<div class="o">  TEXTO</div>
<div style="margin-top:12px"><span class="p">TEXTO </span><span class="c">{{ text }}</span></div>
<div class="o">  TEXTO</div>
<div style="margin-top:12px"><span class="p">TEXTO </span><span class="caret"></span></div>
</div>
</div>

<footer class="slide-footer"><span class="slide-number">{{ slide_number }}</span></footer>
</section></div>
<script src="../../assets/runtime.js"></script>
</body></html>
