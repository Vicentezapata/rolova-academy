<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><title>CTA</title>
<link href="../../assets/fonts.css" rel="stylesheet"/>
<link href="../../assets/base.css" rel="stylesheet"/>
<link href="../../assets/themes/aurora.css" id="theme-link" rel="stylesheet"/>
<link href="../../assets/animations/animations.css" rel="stylesheet"/>
<style>
.cta .btn{display:inline-flex;align-items:center;gap:10px;padding:20px 32px;border-radius:999px;background:var(--accent);color:#0b1024;font-weight:700;font-size:20px;box-shadow:var(--shadow-lg);text-decoration:none;border:none;cursor:pointer}
.cta .btn.outline{background:transparent;color:var(--text-1);border:1.5px solid var(--border-strong)}
</style>
</head><body class="single">
<div class="deck"><section class="slide is-active center tc cta" data-title="CTA">
<div style="max-width:900px">
<p class="kicker">{{ label }}</p>
<h1 class="h1 anim-rise-in" data-anim="rise-in" style="font-size:96px">{{ title }}</h1>
<p class="lede" style="margin:16px auto 30px">{{ text }}</p>
<div class="row" style="justify-content:center">
<a class="btn" href="#">{{ item }}</a>
<a class="btn outline" href="#">{{ item }}</a>
</div>
<p class="dim mt-l" style="font-size:14px">{{ text }}</p>
</div>
</section></div>
<script src="../../assets/runtime.js"></script>
</body></html>
