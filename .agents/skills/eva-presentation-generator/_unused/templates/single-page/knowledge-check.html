<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><title>Knowledge Check</title>
<link href="../../assets/fonts.css" rel="stylesheet"/>
<link href="../../assets/base.css" rel="stylesheet"/>
<link href="../../assets/themes/dark_tech.css" id="theme-link" rel="stylesheet"/>
<link href="../../assets/animations/animations.css" rel="stylesheet"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  .quiz-option {
    padding: 16px 24px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .quiz-option:hover {
    background: var(--surface-3);
  }
  .quiz-option.correct {
    background: color-mix(in srgb, var(--good) 10%, transparent);
    border-color: var(--good);
  }
  .quiz-option.correct .letter {
    background: var(--good);
    color: #fff;
  }
  .letter {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--surface-3);
    font-weight: bold;
    font-size: 14px;
    color: var(--text-2);
  }
</style>
</head><body class="single">
<div class="deck"><section class="slide is-active" data-title="Knowledge Check">
<p class="kicker" style="color:var(--accent-1); display:flex; align-items:center; gap:8px"><i data-lucide="help-circle" style="width:16px;height:16px"></i> {{ kicker }}</p>
<h2 class="h2 mb-l" style="font-size: 40px; line-height: 1.3">{{ title }}</h2>
<div class="grid g1 anim-stagger-list" style="gap:16px; margin-top:40px">
  <div class="quiz-option">
    <div class="letter">A</div>
    <div class="h4" style="margin:0; font-weight:500">{{ option_a }}</div>
  </div>
  <div class="quiz-option">
    <div class="letter">B</div>
    <div class="h4" style="margin:0; font-weight:500">{{ option_b }}</div>
  </div>
  <div class="quiz-option">
    <div class="letter">C</div>
    <div class="h4" style="margin:0; font-weight:500">{{ option_c }}</div>
  </div>
  <div class="quiz-option">
    <div class="letter">D</div>
    <div class="h4" style="margin:0; font-weight:500">{{ option_d }}</div>
  </div>
</div>

<footer class="slide-footer"><span class="slide-number">{{ slide_number }}</span></footer>
</section></div>
<script>if (typeof lucide !== 'undefined') lucide.createIcons();</script>
<script src="../../assets/runtime.js"></script>
</body></html>
