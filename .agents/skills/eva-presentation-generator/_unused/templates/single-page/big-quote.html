<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><title>Big Quote</title>
<link href="../../assets/fonts.css" rel="stylesheet"/>
<link href="../../assets/base.css" rel="stylesheet"/>
<link href="../../assets/themes/editorial-serif.css" id="theme-link" rel="stylesheet"/>
<link href="../../assets/animations/animations.css" rel="stylesheet"/>
</head><body class="single">
<div class="deck"><section class="slide is-active center tc" data-title="Quote">
<div style="max-width:1040px">
<div class="serif" style="font-size:140px;line-height:.9;color:var(--accent);opacity:.6">{{ text }}</div>
<blockquote class="serif anim-fade-up" data-anim="fade-up" style="font-size:56px;line-height:1.25;margin:-40px 0 24px;font-style:italic;font-weight:600">
      {{ quote }}
    </blockquote>
<p class="dim" style="font-size:20px;letter-spacing:.08em">{{ text }}</p>
</div>
</section></div>
<script src="../../assets/runtime.js"></script>
</body></html>
