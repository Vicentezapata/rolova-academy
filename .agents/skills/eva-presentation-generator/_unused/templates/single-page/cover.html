<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/><title>Cover — html-ppt</title>
<link href="../../assets/fonts.css" rel="stylesheet"/>
<link href="../../assets/base.css" rel="stylesheet"/>
<link href="../../assets/themes/minimal-white.css" id="theme-link" rel="stylesheet"/>
<link href="../../assets/animations/animations.css" rel="stylesheet"/>
</head>
<body class="single">
<div class="deck" data-theme-base="../../assets/themes/" data-themes="minimal-white,aurora,catppuccin-mocha,tokyo-night,xiaohongshu-white,neo-brutalism">
<section class="slide is-active" data-title="Cover">
<div class="deck-header"><span class="eyebrow">{{ label }}</span><span class="eyebrow">{{ label }}</span></div>
<div class="anim-stagger-list">
<p class="kicker">{{ label }}</p>
<h1 class="h1 anim-fade-up" data-anim="fade-up">{{ title }}</h1>
<p class="lede">{{ text }}</p>
<div class="row wrap mt-l">
<span class="pill pill-accent">{{ label }}</span>
<span class="pill">{{ label }}</span>
<span class="pill">{{ label }}</span>
<span class="pill">{{ label }}</span>
</div>
</div>
<div class="deck-footer"><span class="dim2">{{ text }}</span><span class="slide-number" data-current="1" data-total="1"></span></div>
<div class="notes">{{ text }}</div>
</section>
</div>
<script src="../../assets/runtime.js"></script>
</body></html>
