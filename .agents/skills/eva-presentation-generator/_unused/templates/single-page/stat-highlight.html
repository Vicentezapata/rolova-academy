<!DOCTYPE html>

<html lang="es"><head><meta charset="utf-8"/><title>Stat Highlight</title>
<link href="../../assets/fonts.css" rel="stylesheet"/>
<link href="../../assets/base.css" rel="stylesheet"/>
<link href="../../assets/themes/minimal-white.css" id="theme-link" rel="stylesheet"/>
<link href="../../assets/animations/animations.css" rel="stylesheet"/>
</head><body class="single">
<div class="deck"><section class="slide is-active center tc" data-title="Stat">
<p class="kicker">{{ label }}</p>
<div style="font-size:260px;line-height:1;font-weight:900;letter-spacing:-.05em">
<span class="counter gradient-text" data-to="92">0</span><span class="gradient-text">%</span>
</div>
<h3 class="mt-s">{{ title }}</h3>
<p class="lede" style="margin:16px auto 0">{{ text }}</p>
</section></div>
<script src="../../assets/runtime.js"></script>
</body></html>
