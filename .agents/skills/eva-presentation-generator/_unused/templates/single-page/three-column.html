<!DOCTYPE html>

<html lang="es"><head><meta charset="utf-8"/><title>Three Column</title>
<link href="../../assets/fonts.css" rel="stylesheet"/>
<link href="../../assets/base.css" rel="stylesheet"/>
<link href="../../assets/themes/minimal-white.css" id="theme-link" rel="stylesheet"/>
<link href="../../assets/animations/animations.css" rel="stylesheet"/>
</head><body class="single">
<div class="deck"><section class="slide is-active" data-title="Three column">
<header class="slide-header">
  <span class="overline">{{ part_label }}</span>
  <h1 class="page-title">{{ title }}</h1>
</header>
<div class="grid g3 mt-l anim-stagger-list" data-anim-target="">
<div class="card"><div style="font-size:40px">🎨</div><h4 class="mt-s">{{ title }}</h4><p class="dim">{{ text }}</p></div>
<div class="card"><div style="font-size:40px">🧱</div><h4 class="mt-s">{{ title }}</h4><p class="dim">{{ text }}</p></div>
<div class="card"><div style="font-size:40px">✨</div><h4 class="mt-s">{{ title }}</h4><p class="dim">{{ text }}</p></div>
</div>

<footer class="slide-footer"><span class="slide-number">{{ slide_number }}</span></footer>
</section></div>
<script src="../../assets/runtime.js"></script>
</body></html>
