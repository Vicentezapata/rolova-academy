<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS DEL PACK — ver theme-packs/TOKENS.md
   Fresh Green: papel crema de herbolario, display serif ligero,
   cursiva salvia, ocre de tierra y hojas botánicas al borde.
   ============================================================ */
:root{
  --bg:#f4ede0; --bg2:#e8dec5;
  --text:#2d3a1f; --text-sec:#5a6840; --text-ter:rgba(45,58,31,0.55);
  --strong:#2d3a1f;

  /* a1 es la salvia profunda porque manda en la cursiva del display;
     el ocre vive en a2 y el olivo legible en a3. */
  --a1:#6b8344; --a2:#a85b3a; --a3:#5a6840;
  --ok:#6b8344; --warn:#b07d2a; --err:#a3452f;
  --a1-t:rgba(107,131,68,0.13); --a1-b:#859e5a;
  --a2-t:rgba(168,91,58,0.12); --a2-b:#a85b3a;
  --a3-t:rgba(90,104,64,0.12); --a3-b:#5a6840;
  --ok-t:rgba(107,131,68,0.13); --ok-b:#6b8344;
  --warn-t:rgba(176,125,42,0.13); --warn-b:#b07d2a;
  --err-t:rgba(163,69,47,0.12); --err-b:#a3452f;

  --card-bg:#f7f1e3; --border:rgba(168,91,58,0.18);
  --bw:1px; --rule-h:1px;
  --radius:4px; --radius-lg:6px;
  --shadow:none; --shadow-sm:none;
  --inset-bg:#efe6d2; --inset-border:rgba(45,58,31,0.14);
  --hi-bg:rgba(168,91,58,0.12);
  --hairline:rgba(45,58,31,0.14);
  --zebra:rgba(45,58,31,0.035);
  --thead-bg:rgba(133,158,90,0.22);

  --code-bg:#efe6d2; --code-fg:#2d3a1f;
  --c-kw:#a85b3a; --c-fn:#6b8344; --c-str:#5a6840; --c-cm:rgba(45,58,31,0.45); --c-num:#b07d2a;

  --display:'Source Serif 4','Fraunces',Georgia,serif;
  --display-xl:'Source Serif 4','Fraunces',Georgia,serif;
  --body:'Inter',-apple-system,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --serif:'Source Serif 4','Fraunces',Georgia,serif;
  --title-shadow:none;
  --em-family:var(--serif); --em-style:italic; --em-weight:400;
  --heavy:500;

  --mermaid-primary:#f7f1e3; --mermaid-text:#2d3a1f; --mermaid-border:#a85b3a;
  --mermaid-line:#859e5a; --mermaid-secondary:#efe6d2; --mermaid-tertiary:#f4ede0;
}
{{SHARED_CSS}}

/* El original no usa monoespaciada: las etiquetas son Inter con
   tracking muy abierto. Reponemos ese detalle sin tocar el código. */
.tag{font-family:var(--body);font-weight:600;letter-spacing:0.34em;color:var(--a3);}
.kicker{font-family:var(--body);font-weight:600;letter-spacing:0.30em;color:var(--a2);}
.slide-num{font-family:var(--body);font-weight:500;letter-spacing:0.26em;}
.chip{font-family:var(--body);letter-spacing:0.14em;text-transform:uppercase;font-weight:500;}
.meta-chip{font-family:var(--body);font-size:11px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;}
.h1,.h2,.h3,h1,h2,h3{letter-spacing:-0.018em;}
.divider{background:rgba(133,158,90,0.55);opacity:1;}

/* ============================================================
   DECORACIONES DE FIRMA DEL PACK
   Grano vegetal, dos filetes de encuadre y hojas botánicas.
   ============================================================ */
.deco-a{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(circle at 25% 30%, rgba(168,91,58,0.05) 1px, transparent 1.5px),
    radial-gradient(circle at 75% 70%, rgba(133,158,90,0.06) 1px, transparent 1.5px);
  background-size:60px 60px, 80px 80px;}

/* Los dos filetes horizontales que encuadran la composición. */
.deco-b{position:absolute;left:60px;right:60px;top:16px;bottom:34px;z-index:0;pointer-events:none;
  border-top:1px solid rgba(45,58,31,0.14);
  border-bottom:1px solid rgba(45,58,31,0.14);}

.deco-c{position:absolute;inset:0;z-index:0;pointer-events:none;}
.deco-c::before,.deco-c::after{content:'';position:absolute;background-repeat:no-repeat;background-size:100% 100%;}
.deco-c::before{width:196px;height:262px;{{LEAF_A}}
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 160'><path d='M60 8 C 28 36, 18 92, 60 152 C 102 92, 92 36, 60 8 Z' fill='%23859e5a' opacity='0.9'/><path d='M60 8 C 28 36, 18 92, 60 152' fill='none' stroke='%235a6840' stroke-width='0.8' opacity='0.6'/><path d='M60 22 L 42 50 M60 40 L 38 70 M60 58 L 36 90 M60 76 L 38 110 M60 94 L 42 128 M60 22 L 78 50 M60 40 L 82 70 M60 58 L 84 90 M60 76 L 82 110 M60 94 L 78 128' stroke='%235a6840' stroke-width='0.6' opacity='0.4' fill='none'/></svg>");}
.deco-c::after{width:132px;height:176px;{{LEAF_B}}
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 160'><path d='M60 8 C 28 36, 18 92, 60 152 C 102 92, 92 36, 60 8 Z' fill='%23a85b3a' opacity='0.72'/><path d='M60 8 C 28 36, 18 92, 60 152' fill='none' stroke='%236b3a25' stroke-width='0.8' opacity='0.5'/><path d='M60 30 L 42 56 M60 50 L 38 80 M60 70 L 38 102 M60 90 L 42 122 M60 30 L 78 56 M60 50 L 82 80 M60 70 L 82 102 M60 90 L 78 122' stroke='%236b3a25' stroke-width='0.5' opacity='0.4' fill='none'/></svg>");}

.slide{background:{{BG}};}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
</script>
</body>
</html>
