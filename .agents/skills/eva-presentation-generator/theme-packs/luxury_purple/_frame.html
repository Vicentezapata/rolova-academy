<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Bodoni+Moda:ital,wght@0,400;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS DEL PACK — ver theme-packs/TOKENS.md
   Maison noir: negro casi puro, crema y oro. Display Playfair
   en cursiva; las etiquetas van en Inter con tracking extremo.
   Sin radios, sin sombras: la jerarquía la dan las reglas de oro.
   ============================================================ */
:root{
  --bg:#060606; --bg2:#0d0d0d;
  --text:#f5e8c8; --text-sec:#e8dcb8; --text-ter:rgba(232,220,184,0.55);
  --strong:#ffffff;

  --a1:#c9a960; --a2:#8a6f3a; --a3:#d8bd7a;
  --ok:#a8c48a; --warn:#d8bd7a; --err:#c98a7a;
  --a1-t:rgba(201,169,96,0.10); --a1-b:rgba(201,169,96,0.45);
  --a2-t:rgba(138,111,58,0.12); --a2-b:rgba(138,111,58,0.55);
  --a3-t:rgba(216,189,122,0.10); --a3-b:rgba(216,189,122,0.45);
  --ok-t:rgba(168,196,138,0.10); --ok-b:rgba(168,196,138,0.42);
  --warn-t:rgba(216,189,122,0.10); --warn-b:rgba(216,189,122,0.42);
  --err-t:rgba(201,138,122,0.10); --err-b:rgba(201,138,122,0.42);

  --card-bg:rgba(201,169,96,0.03); --border:rgba(201,169,96,0.28);
  --bw:1px; --rule-h:1px;
  --radius:0px; --radius-lg:0px;
  --radius-sm:0px; --radius-pill:0px;
  --shadow:none; --shadow-sm:none;
  --inset-bg:rgba(201,169,96,0.05); --inset-border:rgba(201,169,96,0.18);
  --hi-bg:rgba(201,169,96,0.09);
  --hairline:rgba(201,169,96,0.18);
  --zebra:rgba(201,169,96,0.03);
  --thead-bg:rgba(201,169,96,0.10);

  --code-bg:rgba(0,0,0,0.55); --code-fg:#e8dcb8;
  --c-kw:#d8bd7a; --c-fn:#c9a960; --c-str:#a8c48a; --c-cm:rgba(232,220,184,0.45); --c-num:#8a6f3a;

  --display:'Playfair Display','Bodoni Moda','Didot',Georgia,serif;
  --display-xl:'Playfair Display','Bodoni Moda','Didot',Georgia,serif;
  --body:'Inter',-apple-system,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --serif:'Playfair Display','Bodoni Moda',Georgia,serif;
  --title-shadow:0 1px 0 rgba(0,0,0,0.4);
  --em-family:var(--serif); --em-style:italic; --em-weight:400;
  --heavy:500;

  --mermaid-primary:#0d0d0d; --mermaid-text:#f5e8c8; --mermaid-border:#c9a960;
  --mermaid-line:#8a6f3a; --mermaid-secondary:#060606; --mermaid-tertiary:#0d0d0d;
}
{{SHARED_CSS}}

/* Display en cursiva y etiquetas con tracking de invitación. */
.h1,.h2,.h3,.display,.kicker,h1,h2,h3{font-style:italic;}
.tag{font-family:var(--body);letter-spacing:0.42em;font-weight:400;text-transform:uppercase;color:var(--a1);}
.slide-num{letter-spacing:0.4em;color:var(--a2);}

/* ============================================================
   DECORACIONES DE FIRMA DEL PACK
   Viñeta + retícula de oro, cuatro esquinas y regla ornamental.
   ============================================================ */
.deco-a{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(ellipse 60% 40% at 50% 50%, rgba(201,169,96,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 100% 100% at 50% 100%, rgba(0,0,0,0.6) 0%, transparent 50%),
    linear-gradient(rgba(201,169,96,0.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,169,96,0.012) 1px, transparent 1px);
  background-size:auto, auto, 120px 120px, 120px 120px;}
.deco-a::before,.deco-a::after{content:'';position:absolute;width:18px;height:18px;opacity:.55;}
.deco-a::before{top:32px;left:32px;border-top:1px solid #8a6f3a;border-left:1px solid #8a6f3a;}
.deco-a::after{top:32px;right:32px;border-top:1px solid #8a6f3a;border-right:1px solid #8a6f3a;}

.deco-c{position:absolute;inset:0;z-index:0;pointer-events:none;}
.deco-c::before,.deco-c::after{content:'';position:absolute;width:18px;height:18px;opacity:.55;}
.deco-c::before{bottom:32px;left:32px;border-bottom:1px solid #8a6f3a;border-left:1px solid #8a6f3a;}
.deco-c::after{bottom:32px;right:32px;border-bottom:1px solid #8a6f3a;border-right:1px solid #8a6f3a;}

.deco-b{position:absolute;height:1px;z-index:1;pointer-events:none;
  background:linear-gradient(90deg, transparent, #c9a960 50%, transparent);{{RULE}}}

.slide{background:{{BG}};}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
</script>
</body>
</html>
