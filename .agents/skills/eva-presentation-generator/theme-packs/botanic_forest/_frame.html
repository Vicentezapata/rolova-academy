<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS DEL PACK — ver theme-packs/TOKENS.md
   Botanic Forest: bosque profundo, display serif, cursiva dorada,
   cartas casi transparentes de borde fino y radio mínimo.
   ============================================================ */
:root{
  --bg:#122318; --bg2:#0a1410;
  --text:#e8efe2; --text-sec:rgba(232,239,226,0.70); --text-ter:rgba(232,239,226,0.42);
  --strong:#e8efe2;

  --a1:#ff8c42; --a2:#7a9a6f; --a3:#e8b86d;
  --ok:#8fbf7f; --warn:#e8b86d; --err:#e07a5f;
  --a1-t:rgba(255,140,66,0.12); --a1-b:rgba(255,140,66,0.42);
  --a2-t:rgba(122,154,111,0.14); --a2-b:rgba(122,154,111,0.45);
  --a3-t:rgba(232,184,109,0.12); --a3-b:rgba(232,184,109,0.42);
  --ok-t:rgba(143,191,127,0.13); --ok-b:rgba(143,191,127,0.42);
  --warn-t:rgba(232,184,109,0.13); --warn-b:rgba(232,184,109,0.42);
  --err-t:rgba(224,122,95,0.13); --err-b:rgba(224,122,95,0.42);

  --card-bg:rgba(255,255,255,0.025); --border:rgba(232,239,226,0.12);
  --bw:1px; --rule-h:1px;
  --radius:4px; --radius-lg:6px;
  --shadow:none; --shadow-sm:none;
  --inset-bg:rgba(255,255,255,0.02); --inset-border:rgba(232,239,226,0.10);
  --hi-bg:rgba(255,140,66,0.09);
  --hairline:rgba(232,239,226,0.14);
  --zebra:rgba(232,239,226,0.03);
  --thead-bg:rgba(122,154,111,0.16);

  --code-bg:rgba(10,20,16,0.7); --code-fg:#e8efe2;
  --c-kw:#e8b86d; --c-fn:#ff8c42; --c-str:#8fbf7f; --c-cm:rgba(232,239,226,0.42); --c-num:#7a9a6f;

  --display:'Source Serif 4','Fraunces',Georgia,serif;
  --display-xl:'Source Serif 4','Fraunces',Georgia,serif;
  --body:'Inter',-apple-system,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --serif:'Source Serif 4','Fraunces',Georgia,serif;
  --title-shadow:none;
  --em-family:var(--serif); --em-style:italic; --em-weight:400;
  --heavy:600;

  --mermaid-primary:#1a2e1f; --mermaid-text:#e8efe2; --mermaid-border:#ff8c42;
  --mermaid-line:#7a9a6f; --mermaid-secondary:#0d1a14; --mermaid-tertiary:#122318;
}
{{SHARED_CSS}}

/* Etiquetas en mono con tracking ancho, como el diario de campo. */
.tag{font-family:var(--mono);letter-spacing:0.24em;font-weight:500;}
.slide-num{letter-spacing:0.18em;}

/* ============================================================
   DECORACIONES DE FIRMA DEL PACK
   Grano + esquinas en L, disco solar y cordillera al pie.
   ============================================================ */
.deco-a{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(circle at 25% 30%, rgba(232,239,226,0.025) 1px, transparent 1.4px),
    radial-gradient(circle at 75% 65%, rgba(232,239,226,0.018) 1px, transparent 1.4px);
  background-size:7px 7px, 11px 11px;}
.deco-a::before,.deco-a::after{content:'';position:absolute;width:22px;height:22px;}
.deco-a::before{top:26px;left:28px;border-top:1px solid rgba(232,239,226,0.32);border-left:1px solid rgba(232,239,226,0.32);}
.deco-a::after{bottom:26px;right:28px;border-bottom:1px solid rgba(232,239,226,0.32);border-right:1px solid rgba(232,239,226,0.32);}

.deco-b{position:absolute;width:150px;height:150px;border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 45% 45%, rgba(255,180,120,0.55) 0%, rgba(255,140,66,0.25) 45%, rgba(255,140,66,0) 75%);
  {{SUN}}}

.deco-c{position:absolute;left:0;right:0;bottom:0;height:200px;z-index:0;pointer-events:none;opacity:.9;
  background-repeat:no-repeat;background-size:100% 100%;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 200' preserveAspectRatio='none'><polygon points='0,200 180,70 280,110 410,40 540,95 660,55 780,105 900,60 1020,95 1140,70 1280,90 1280,200' fill='%230a1410' opacity='0.95'/><polygon points='0,200 130,110 260,135 380,95 500,125 640,100 760,130 880,105 1000,130 1120,110 1280,125 1280,200' fill='%23142a1c' opacity='0.85'/><polygon points='0,200 110,150 240,165 360,140 500,160 640,145 780,165 900,150 1040,165 1160,150 1280,160 1280,200' fill='%231a3522' opacity='0.7'/></svg>");}

.slide{background:{{BG}};}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
</script>
</body>
</html>
