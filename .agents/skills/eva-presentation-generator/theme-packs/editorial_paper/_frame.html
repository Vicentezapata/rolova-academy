<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== TOKENS DEL PACK — ver theme-packs/TOKENS.md ===== */
:root{
  --bg:#faf7f2; --bg2:#f0ebe1;
  --text:#1c1917; --text-sec:rgba(28,25,23,0.66); --text-ter:rgba(28,25,23,0.40);
  --strong:#1c1917;

  --a1:#9a3412; --a2:#1e3a5f; --a3:#a16207;
  --ok:#166534; --warn:#a16207; --err:#9f1239;
  --a1-t:rgba(154,52,18,0.08); --a1-b:rgba(154,52,18,0.28);
  --a2-t:rgba(30,58,95,0.07); --a2-b:rgba(30,58,95,0.24);
  --a3-t:rgba(161,98,7,0.08); --a3-b:rgba(161,98,7,0.26);
  --ok-t:rgba(22,101,52,0.09); --ok-b:rgba(22,101,52,0.28);
  --warn-t:rgba(161,98,7,0.10); --warn-b:rgba(161,98,7,0.30);
  --err-t:rgba(159,18,57,0.08); --err-b:rgba(159,18,57,0.26);

  --card-bg:#ffffff;
  --border:rgba(28,25,23,0.14); --bw:1px; --rule-h:1px;
  --radius:3px; --radius-lg:4px;
  --shadow:0 1px 2px rgba(28,25,23,0.05); --shadow-sm:none;
  --inset-bg:rgba(28,25,23,0.03); --inset-border:rgba(28,25,23,0.10);
  --hi-bg:rgba(154,52,18,0.06);
  --hairline:rgba(28,25,23,0.09);
  --zebra:rgba(28,25,23,0.025);
  --thead-bg:rgba(30,58,95,0.07);

  --code-bg:#f5f2ec; --code-fg:#1c1917;
  --c-kw:#9a3412; --c-fn:#1e3a5f; --c-str:#166534; --c-cm:rgba(28,25,23,0.42); --c-num:#a16207;

  --display:'Newsreader',Georgia,serif;
  --display-xl:'Newsreader',Georgia,serif;
  --body:'Inter',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --serif:'Newsreader',Georgia,serif;
  --title-shadow:none;
  --em-family:var(--serif); --em-style:italic; --em-weight:400;
  --heavy:700;

  --mermaid-primary:#ffffff; --mermaid-text:#1c1917; --mermaid-border:#1e3a5f;
  --mermaid-line:#9a3412; --mermaid-secondary:#f0ebe1; --mermaid-tertiary:#faf7f2;
}
{{SHARED_CSS}}

/* ===== DECORACIONES DE FIRMA DEL PACK ===== */
/* Editorial impreso: reglas finas, sin ruido, márgenes tipográficos. */
.deco-a{position:absolute;top:0;left:0;right:0;height:4px;z-index:1;background:var(--a2);}
.deco-b{position:absolute;top:14px;left:48px;right:48px;height:1px;z-index:1;background:var(--hairline);}
.deco-c{position:absolute;bottom:34px;left:48px;right:48px;height:1px;z-index:1;background:var(--hairline);}
.h2{letter-spacing:-0.01em;}
.tag{letter-spacing:0.14em;}
.slide{background:{{PAPER}};}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
</script>
</body>
</html>
