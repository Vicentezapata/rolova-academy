<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS DEL PACK — ver theme-packs/TOKENS.md
   Bauhaus: papel cálido, reglas finas de tinta, cero radio,
   cero sombra, cartas blancas y tres colores primarios planos.
   ============================================================ */
:root{
  --bg:#f4f0e8; --bg2:#efe9dc;
  --text:#1a1a1a; --text-sec:#5a5a5a; --text-ter:#8a8a85;
  --strong:#1a1a1a;

  --a1:#d62828; --a2:#003049; --a3:#ffd60a;
  --ok:#2d6a4f; --warn:#b07d1a; --err:#a4161a;
  --a1-t:rgba(214,40,40,0.10); --a1-b:#d62828;
  --a2-t:rgba(0,48,73,0.10); --a2-b:#003049;
  --a3-t:rgba(255,214,10,0.22); --a3-b:#ffd60a;
  --ok-t:rgba(45,106,79,0.10); --ok-b:#2d6a4f;
  --warn-t:rgba(176,125,26,0.12); --warn-b:#b07d1a;
  --err-t:rgba(164,22,26,0.10); --err-b:#a4161a;

  --card-bg:#ffffff; --border:#1a1a1a; --bw:1.5px; --rule-h:1.5px;
  --radius:0px; --radius-lg:0px;
  --radius-sm:0px; --radius-pill:0px;
  --shadow:none; --shadow-sm:none;
  --inset-bg:#efe9dc; --inset-border:#1a1a1a;
  --hi-bg:rgba(255,214,10,0.28);
  --hairline:rgba(26,26,26,0.25);
  --zebra:rgba(26,26,26,0.04);
  --thead-bg:rgba(0,48,73,0.10);

  --code-bg:#ffffff; --code-fg:#1a1a1a;
  --c-kw:#003049; --c-fn:#d62828; --c-str:#2d6a4f; --c-cm:#8a8a85; --c-num:#b07d1a;

  --display:'Helvetica Neue','Inter Tight','Inter',sans-serif;
  --display-xl:'Helvetica Neue','Inter Tight','Inter',sans-serif;
  --body:'Helvetica Neue','Inter','Inter Tight',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --serif:'Helvetica Neue','Inter Tight',sans-serif;
  --title-shadow:none;
  --em-family:var(--display); --em-style:normal; --em-weight:600;
  --heavy:800;

  --mermaid-primary:#ffffff; --mermaid-text:#1a1a1a; --mermaid-border:#1a1a1a;
  --mermaid-line:#003049; --mermaid-secondary:#efe9dc; --mermaid-tertiary:#f4f0e8;
}
{{SHARED_CSS}}

/* Rejilla tipográfica plana: sin degradados ni cursivas. */
.h1,.h2,.display{letter-spacing:-0.035em;}
.tag{letter-spacing:0.28em;font-family:var(--display);font-weight:700;}

/* ============================================================
   DECORACIONES DE FIRMA DEL PACK
   Regla superior, regla inferior y un bloque geométrico plano.
   ============================================================ */
.deco-a{position:absolute;top:20px;left:48px;right:48px;height:1.5px;background:#1a1a1a;z-index:1;}
.deco-c{position:absolute;bottom:34px;left:48px;right:48px;height:1.5px;background:#1a1a1a;z-index:1;}
.deco-b{position:absolute;width:96px;height:96px;z-index:0;{{GEO}}}
.slide{background:var(--bg);}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
</script>
</body>
</html>
