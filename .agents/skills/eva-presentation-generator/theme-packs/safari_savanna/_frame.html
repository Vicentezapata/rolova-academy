<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS DEL PACK — ver theme-packs/TOKENS.md
   Safari Savanna: cuaderno de expedición. Doble marco, resplandor
   de horizonte al pie, Playfair con cursiva de tierra quemada.
   ============================================================ */
:root{
  --bg:#e8d4a8; --bg2:#ddc28a;
  --text:#2a1f0f; --text-sec:#5a4a30; --text-ter:#7a6a4a;
  --strong:#2a1f0f;

  --a1:#c44d2a; --a2:#8b3a1f; --a3:#5a4a30;
  --ok:#4e6b32; --warn:#b8732b; --err:#8b3a1f;
  --a1-t:rgba(196,77,42,0.09); --a1-b:#c44d2a;
  --a2-t:rgba(139,58,31,0.09); --a2-b:#8b3a1f;
  --a3-t:rgba(90,74,48,0.09); --a3-b:#5a4a30;
  --ok-t:rgba(78,107,50,0.09); --ok-b:#4e6b32;
  --warn-t:rgba(184,115,43,0.10); --warn-b:#b8732b;
  --err-t:rgba(139,58,31,0.09); --err-b:#8b3a1f;

  --card-bg:rgba(255,250,235,0.35); --border:rgba(90,74,48,0.32);
  --bw:1px; --rule-h:1px;
  --radius:0px; --radius-lg:0px;
  --radius-sm:0px; --radius-pill:0px;
  --shadow:none; --shadow-sm:none;
  --inset-bg:rgba(255,250,235,0.40); --inset-border:rgba(90,74,48,0.22);
  --hi-bg:rgba(196,77,42,0.10);
  --hairline:rgba(90,74,48,0.22);
  --zebra:rgba(90,74,48,0.04);
  --thead-bg:rgba(139,58,31,0.14);

  --code-bg:rgba(255,250,235,0.45); --code-fg:#2a1f0f;
  --c-kw:#8b3a1f; --c-fn:#c44d2a; --c-str:#4e6b32; --c-cm:#7a6a4a; --c-num:#b8732b;

  --display:'Playfair Display','Fraunces',Georgia,serif;
  --display-xl:'Playfair Display','Fraunces',Georgia,serif;
  --body:'Source Serif 4',Georgia,'Iowan Old Style',serif;
  --mono:'JetBrains Mono','Courier New',monospace;
  --serif:'Playfair Display',Georgia,serif;
  --title-shadow:none;
  --em-family:var(--serif); --em-style:italic; --em-weight:400;
  --heavy:700;

  --mermaid-primary:#f3e6cc; --mermaid-text:#2a1f0f; --mermaid-border:#c44d2a;
  --mermaid-line:#5a4a30; --mermaid-secondary:#e8d4a8; --mermaid-tertiary:#f3e6cc;
}
{{SHARED_CSS}}

/* Toda la metadata del cuaderno va en monoespaciada con tracking abierto. */
.h1,.h2,.h3,h1,h2,h3{letter-spacing:-0.035em;}
.tag,.kicker{letter-spacing:0.24em;font-weight:600;}
.slide-num{letter-spacing:0.26em;font-weight:500;}
.chip,.meta-chip{font-family:var(--mono);font-weight:600;letter-spacing:0.22em;text-transform:uppercase;}

/* ============================================================
   DECORACIONES DE FIRMA DEL PACK
   Grano de cuatro tramas, doble marco de sobre, resplandor de
   horizonte al pie y las escuadras de tierra quemada.
   ============================================================ */
.deco-a{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0.7;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(139,58,31,0.06) 0%, transparent 2%),
    radial-gradient(circle at 70% 60%, rgba(196,77,42,0.05) 0%, transparent 2.5%),
    radial-gradient(circle at 45% 80%, rgba(90,74,48,0.05) 0%, transparent 2%),
    radial-gradient(circle at 85% 15%, rgba(90,74,48,0.04) 0%, transparent 2%);
  background-size:14px 14px, 18px 18px, 22px 22px, 16px 16px;}

/* Resplandor de horizonte: 220px de calor al pie de la lámina. */
.deco-b{position:absolute;left:0;right:0;bottom:0;height:220px;z-index:0;pointer-events:none;
  background:{{HORIZON}};}

/* Doble marco: 1.5px por fuera, 0.5px por dentro. Es la firma. */
.deco-c{position:absolute;inset:16px;z-index:0;pointer-events:none;
  border:1.5px solid #5a4a30;}
.deco-c::before{content:'';position:absolute;inset:6px;border:0.5px solid rgba(90,74,48,0.45);}
.deco-c::after{content:'';position:absolute;top:-6px;left:-6px;width:22px;height:22px;
  border-top:1px solid #8b3a1f;border-left:1px solid #8b3a1f;}

.slide{background:{{BG}};}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
</script>
</body>
</html>
