<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS DEL PACK — ver theme-packs/TOKENS.md
   Cyberpunk Neon: violeta profundo, neón cian/magenta, TODO el
   cuerpo en monoespaciada y esquinas cortadas por clip-path
   (no border-radius). El título lleva aberración cromática.
   ============================================================ */
:root{
  --bg:#0a0014; --bg2:#14002a;
  --text:#ffffff; --text-sec:rgba(255,255,255,0.62); --text-ter:rgba(255,255,255,0.38);
  --strong:#ffffff;

  --a1:#00ffff; --a2:#ff00c8; --a3:#ffd60a;
  --ok:#00ffb0; --warn:#ffd60a; --err:#ff4d6d;
  --a1-t:rgba(0,255,255,0.10); --a1-b:#00ffff;
  --a2-t:rgba(255,0,200,0.10); --a2-b:#ff00c8;
  --a3-t:rgba(255,214,10,0.10); --a3-b:#ffd60a;
  --ok-t:rgba(0,255,176,0.10); --ok-b:#00ffb0;
  --warn-t:rgba(255,214,10,0.10); --warn-b:#ffd60a;
  --err-t:rgba(255,77,109,0.10); --err-b:#ff4d6d;

  --card-bg:linear-gradient(135deg, rgba(255,0,200,0.10) 0%, rgba(0,255,255,0.05) 100%);
  --border:#ff00c8; --bw:1px; --rule-h:1px;
  --radius:0px; --radius-lg:0px;
  --radius-sm:0px; --radius-pill:0px;
  --shadow:0 0 0 1px rgba(255,0,200,0.15), inset 0 0 24px rgba(255,0,200,0.18);
  --shadow-sm:inset 0 0 18px rgba(0,255,255,0.14);
  --inset-bg:rgba(0,255,255,0.05); --inset-border:rgba(0,255,255,0.45);
  --hi-bg:rgba(0,255,255,0.12);
  --hairline:rgba(0,255,255,0.18);
  --zebra:rgba(0,255,255,0.04);
  --thead-bg:rgba(255,0,200,0.14);

  --code-bg:rgba(0,0,0,0.55); --code-fg:#e8f8ff;
  --c-kw:#ff00c8; --c-fn:#00ffff; --c-str:#00ffb0; --c-cm:rgba(255,255,255,0.38); --c-num:#ffd60a;

  --display:'Orbitron','JetBrains Mono',monospace;
  --display-xl:'Orbitron','JetBrains Mono',monospace;
  --body:'JetBrains Mono','DM Mono',monospace;
  --mono:'JetBrains Mono',monospace;
  --serif:'Orbitron','JetBrains Mono',monospace;
  --title-shadow:3px 0 0 rgba(255,0,200,0.55), -3px 0 0 rgba(0,255,255,0.55), 0 0 24px rgba(0,255,255,0.22);
  --em-family:var(--mono); --em-style:normal; --em-weight:700;
  --heavy:900;

  --mermaid-primary:#14002a; --mermaid-text:#ffffff; --mermaid-border:#00ffff;
  --mermaid-line:#ff00c8; --mermaid-secondary:#1a0020; --mermaid-tertiary:#0a0014;
}
{{SHARED_CSS}}

/* Las esquinas se cortan con clip-path, no se redondean: es la firma. */
.card,[class*="card"],[class*="panel"],[class*="box"],[class*="stat"]{
  clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
}
.h1,.h2,.h3,.display,h1,h2,h3{text-transform:uppercase;letter-spacing:-0.035em;}
.tag{letter-spacing:0.28em;color:var(--a1);text-shadow:0 0 8px rgba(0,255,255,0.6);}
.slide-num{color:var(--a1);text-shadow:0 0 8px rgba(0,255,255,0.5);}

/* ============================================================
   DECORACIONES DE FIRMA DEL PACK
   Retícula 64px + scanlines, línea de horizonte y marco cortado.
   ============================================================ */
.deco-a{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,255,255,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.07) 1px, transparent 1px);
  background-size:64px 64px;}

.deco-b{position:absolute;left:0;right:0;height:1px;z-index:1;pointer-events:none;
  background:linear-gradient(90deg, transparent 0%, rgba(0,255,255,0.55) 30%, rgba(255,0,200,0.55) 70%, transparent 100%);
  box-shadow:0 0 18px rgba(0,255,255,0.4);
  {{HORIZON}}}

.deco-c{position:absolute;inset:18px;z-index:6;pointer-events:none;
  border:1px solid rgba(0,255,255,0.18);
  clip-path:polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));}
/* Las scanlines van encima de todo, como en un CRT. */
.deco-c::after{content:'';position:absolute;inset:-18px;
  background:repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,255,255,0.035) 3px, rgba(0,255,255,0.035) 4px);}

.slide{background:{{BG}};}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' ','+','-'].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.type === 'text-zoom') {
      const content = document.querySelector('.content') || document.querySelector('.slide') || document.body;
      if (content) content.style.zoom = e.data.scale;
    }
  });
</script>
</body>
</html>
