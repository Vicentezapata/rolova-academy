<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS DEL PACK — ver theme-packs/TOKENS.md
   Royal Red: laca oxblood, oro de corte, escuadras grandes y
   filetes cortos centrados. El bermellón solo sella.
   ============================================================ */
:root{
  --bg:#4a0606; --bg2:#2d0303;
  --text:#fff8e7; --text-sec:rgba(255,248,231,0.70); --text-ter:rgba(255,248,231,0.42);
  --strong:#fff8e7;

  /* La paleta es oro y crema sobre laca. El bermellón #c0392b no llega
     a 3:1 sobre el fondo: vive solo como relleno de sello (--err-b). */
  --a1:#c9a960; --a2:#e0c88a; --a3:#d4a08a;
  --ok:#9ec48a; --warn:#e0c88a; --err:#e8907e;
  --a1-t:rgba(201,169,96,0.12); --a1-b:rgba(201,169,96,0.55);
  --a2-t:rgba(224,200,138,0.10); --a2-b:rgba(224,200,138,0.45);
  --a3-t:rgba(212,160,138,0.12); --a3-b:rgba(212,160,138,0.45);
  --ok-t:rgba(158,196,138,0.12); --ok-b:rgba(158,196,138,0.42);
  --warn-t:rgba(224,200,138,0.12); --warn-b:rgba(224,200,138,0.45);
  --err-t:rgba(192,57,43,0.22); --err-b:#c0392b;

  --card-bg:rgba(255,248,231,0.035); --border:rgba(201,169,96,0.22);
  --bw:1px; --rule-h:1px;
  --radius:2px; --radius-lg:2px;
  --radius-sm:2px; --radius-pill:2px;
  --shadow:none; --shadow-sm:none;
  --inset-bg:rgba(0,0,0,0.20); --inset-border:rgba(201,169,96,0.18);
  --hi-bg:rgba(201,169,96,0.14);
  --hairline:rgba(201,169,96,0.22);
  --zebra:rgba(255,248,231,0.03);
  --thead-bg:rgba(201,169,96,0.16);

  --code-bg:rgba(0,0,0,0.35); --code-fg:#fff8e7;
  --c-kw:#e0c88a; --c-fn:#c9a960; --c-str:#9ec48a; --c-cm:rgba(255,248,231,0.42); --c-num:#d4a08a;

  --display:'Noto Serif SC','Source Han Serif SC',Georgia,serif;
  --display-xl:'Noto Serif SC','Source Han Serif SC',Georgia,serif;
  --body:'Inter',-apple-system,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --serif:'Noto Serif SC',Georgia,serif;
  --title-shadow:none;
  --em-family:var(--display); --em-style:normal; --em-weight:600;
  --heavy:500;

  --mermaid-primary:#5c0c0c; --mermaid-text:#fff8e7; --mermaid-border:#c9a960;
  --mermaid-line:#e0c88a; --mermaid-secondary:#3a0505; --mermaid-tertiary:#4a0606;
}
{{SHARED_CSS}}

/* Tracking abierto de rótulo imperial, moderado para que el español respire. */
.h1,.h2,.h3,h1,h2,h3{letter-spacing:0.08em;}
.tag,.kicker{font-family:var(--body);font-weight:500;letter-spacing:0.42em;}
.slide-num{font-family:var(--body);font-weight:500;letter-spacing:0.30em;}
.chip,.meta-chip{font-family:var(--body);font-weight:500;letter-spacing:0.28em;text-transform:uppercase;}

/* ============================================================
   DECORACIONES DE FIRMA DEL PACK
   Grano y viñeta, escuadras doradas de 50px y dos filetes cortos.
   ============================================================ */
.deco-a{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    {{VIGNETTE}},
    radial-gradient(circle, rgba(255,248,231,0.025) 1px, transparent 1px);
  background-size:auto, 6px 6px;}

/* Escuadras grandes: 50px de oro en las cuatro esquinas. */
.deco-b{position:absolute;inset:0;z-index:0;pointer-events:none;}
.deco-b::before,.deco-b::after{content:'';position:absolute;width:50px;height:50px;}
.deco-b::before{top:16px;left:16px;border-top:1px solid #c9a960;border-left:1px solid #c9a960;}
.deco-b::after{top:16px;right:16px;border-top:1px solid #c9a960;border-right:1px solid #c9a960;}

.deco-c{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-repeat:no-repeat, no-repeat;
  background-image:
    linear-gradient(90deg, transparent, rgba(201,169,96,0.55), transparent),
    linear-gradient(90deg, transparent, rgba(201,169,96,0.55), transparent);
  background-size:220px 1px, 220px 1px;
  background-position:center 12px, center calc(100% - 13px);}
.deco-c::before,.deco-c::after{content:'';position:absolute;width:50px;height:50px;}
.deco-c::before{bottom:16px;left:16px;border-bottom:1px solid #c9a960;border-left:1px solid #c9a960;}
.deco-c::after{bottom:16px;right:16px;border-bottom:1px solid #c9a960;border-right:1px solid #c9a960;}

.slide{background:{{BG}};}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
</script>
</body>
</html>
