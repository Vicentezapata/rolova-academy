<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS DEL PACK — ver theme-packs/TOKENS.md
   Minimal Gray: papel de revista trimestral, Playfair de titular,
   cuerpo serif, filete grueso de cabecera y un solo ladrillo.
   ============================================================ */
:root{
  --bg:#f7f1e3; --bg2:#efe7d2;
  --text:#1a1a1a; --text-sec:#404040; --text-ter:#666666;
  --strong:#1a1a1a;

  /* La paleta del original es tinta + un ladrillo. No se inventan más. */
  --a1:#a0392b; --a2:#1a1a1a; --a3:#666666;
  --ok:#3f6b3f; --warn:#8a6420; --err:#a0392b;
  --a1-t:rgba(160,57,43,0.07); --a1-b:#a0392b;
  --a2-t:rgba(26,26,26,0.06); --a2-b:#1a1a1a;
  --a3-t:rgba(102,102,102,0.08); --a3-b:#666666;
  --ok-t:rgba(63,107,63,0.08); --ok-b:#3f6b3f;
  --warn-t:rgba(138,100,32,0.08); --warn-b:#8a6420;
  --err-t:rgba(160,57,43,0.07); --err-b:#a0392b;

  --card-bg:rgba(255,255,255,0.34); --border:rgba(26,26,26,0.22);
  --bw:1px; --rule-h:2px;
  --radius:0px; --radius-lg:0px;
  --radius-sm:0px; --radius-pill:0px;
  --shadow:none; --shadow-sm:none;
  --inset-bg:#efe7d2; --inset-border:rgba(26,26,26,0.18);
  --hi-bg:rgba(160,57,43,0.08);
  --hairline:rgba(26,26,26,0.12);
  --zebra:rgba(26,26,26,0.03);
  --thead-bg:rgba(26,26,26,0.08);

  --code-bg:#efe7d2; --code-fg:#1a1a1a;
  --c-kw:#a0392b; --c-fn:#1a1a1a; --c-str:#3f6b3f; --c-cm:#666666; --c-num:#8a6420;

  --display:'Playfair Display','Iowan Old Style',Georgia,serif;
  --display-xl:'Playfair Display','Iowan Old Style',Georgia,serif;
  --body:'Source Serif 4','Charter',Georgia,serif;
  --mono:'JetBrains Mono',monospace;
  --serif:'Playfair Display',Georgia,serif;
  --title-shadow:none;
  --em-family:var(--serif); --em-style:italic; --em-weight:500;
  --heavy:600;

  --mermaid-primary:#efe7d2; --mermaid-text:#1a1a1a; --mermaid-border:#a0392b;
  --mermaid-line:#1a1a1a; --mermaid-secondary:#f7f1e3; --mermaid-tertiary:#efe7d2;
}
{{SHARED_CSS}}

/* El filete de 2px bajo la cabecera es lo que hace que esto parezca
   una portada de revista y no una diapositiva. */
.divider{background:var(--text);opacity:1;}
.h1,.h2,.h3,h1,h2,h3{letter-spacing:-0.025em;}
.tag,.kicker{font-family:'Inter',sans-serif;font-weight:600;letter-spacing:0.22em;}
.slide-num{font-family:'Inter',sans-serif;font-weight:500;letter-spacing:0.20em;}
.chip,.meta-chip{font-family:'Inter',sans-serif;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;}

/* ============================================================
   DECORACIONES DE FIRMA DEL PACK
   Grano de papel, marco interior de 1px y filete de pie.
   ============================================================ */
.deco-a{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    {{NOISE}},
    radial-gradient(circle, rgba(0,0,0,0.012) 1px, transparent 1px);
  background-size:auto, auto, 4px 4px;}

.deco-b{position:absolute;top:20px;left:20px;right:20px;bottom:20px;z-index:0;pointer-events:none;
  border:1px solid rgba(26,26,26,0.08);}

.deco-c{position:absolute;left:48px;right:48px;bottom:34px;height:1px;z-index:0;pointer-events:none;
  background:rgba(26,26,26,0.22);}

.slide{background:{{BG}};}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
</script>
</body>
</html>
