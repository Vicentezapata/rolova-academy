<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Bagel+Fat+One&display=swap" rel="stylesheet">
<style>
/* ===== TOKENS DEL PACK — ver theme-packs/TOKENS.md ===== */
:root{
  --bg:#f4e9d0; --bg2:#ebdcb2;
  --text:#2a1810; --text-sec:rgba(42,24,16,0.62); --text-ter:rgba(42,24,16,0.38);
  --strong:#2a1810;

  --a1:#e07a3e; --a2:#c14d3f; --a3:#d4a82a;
  --ok:#166534; --warn:#a16207; --err:#9f1239;
  --a1-t:rgba(224,122,62,0.2); --a1-b:rgba(224,122,62,0.85);
  --a2-t:rgba(193,77,63,0.2); --a2-b:rgba(193,77,63,0.85);
  --a3-t:rgba(212,168,42,0.2); --a3-b:rgba(212,168,42,0.85);
  --ok-t:rgba(22,101,52,0.2); --ok-b:rgba(22,101,52,0.85);
  --warn-t:rgba(161,98,7,0.2); --warn-b:rgba(161,98,7,0.85);
  --err-t:rgba(159,18,57,0.2); --err-b:rgba(159,18,57,0.85);

  --card-bg:rgba(255,255,255,0.45); --border:#2a1810; --bw:2px; --rule-h:3px;
  --radius:10px; --radius-lg:14px;
  --shadow:4px 4px 0 rgba(42,24,16,0.85); --shadow-sm:3px 3px 0 rgba(42,24,16,0.85);
  --inset-bg:rgba(255,255,255,0.55); --inset-border:rgba(42,24,16,0.35);
  --hi-bg:rgba(224,122,62,0.1); --hairline:rgba(42,24,16,0.16); --zebra:rgba(42,24,16,0.05); --thead-bg:rgba(193,77,63,0.12);

  --code-bg:rgba(255,255,255,0.72); --code-fg:#2a1810;
  --c-kw:#c14d3f; --c-fn:#e07a3e; --c-str:#166534; --c-cm:rgba(42,24,16,0.38); --c-num:#d4a82a;

  --display:'Inter Tight','Inter',sans-serif;
  --display-xl:'Bagel Fat One','Inter Tight','Inter',sans-serif;
  --body:'Inter',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --serif:'Bagel Fat One',Georgia,serif;
  --title-shadow:2px 2px 0 rgba(193,77,63,0.2);
  --em-family:var(--serif); --em-style:normal; --em-weight:400;
  --heavy:900;

  --mermaid-primary:#ebdcb2; --mermaid-text:#2a1810; --mermaid-border:#e07a3e;
  --mermaid-line:#c14d3f; --mermaid-secondary:#f4e9d0; --mermaid-tertiary:#ebdcb2;
}
{{SHARED_CSS}}

/* ===== DECORACIONES DE FIRMA DEL PACK ===== */
.deco-a{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse 60% 45% at 20% 22%, rgba(212,168,42,0.18) 0%, transparent 60%),radial-gradient(ellipse 55% 40% at 84% 82%, rgba(224,122,62,0.14) 0%, transparent 65%);}
.deco-b{position:absolute;left:0;right:0;top:0;height:14px;z-index:1;opacity:.78;background:repeating-linear-gradient(90deg,#2a1810 0 36px,#e07a3e 36px 72px,#d4a82a 72px 108px,#c14d3f 108px 144px);}
.deco-c{position:absolute;left:0;right:0;bottom:0;height:14px;z-index:1;opacity:.78;background:repeating-linear-gradient(90deg,#2a1810 0 36px,#e07a3e 36px 72px,#d4a82a 72px 108px,#c14d3f 108px 144px);}
.slide{background:{{BG}};}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
</script>
</body>
</html>
