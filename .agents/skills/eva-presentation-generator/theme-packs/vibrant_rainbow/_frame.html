<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS DEL PACK — ver theme-packs/TOKENS.md
   Vibrant Rainbow: degradado espectral a 135°, esferas de vidrio
   con brillo especular y cursiva ámbar sobre blanco puro.
   ============================================================ */
:root{
  --bg:#b266ff; --bg2:#4a8cff;
  --text:#ffffff; --text-sec:rgba(255,255,255,0.92); --text-ter:rgba(255,255,255,0.72);
  --strong:#ffffff;

  /* Sobre un fondo espectral el único texto seguro es blanco. Los
     colores de marca viven en los rellenos (-b) y en las esferas. */
  --a1:#ffe8b0; --a2:#ffffff; --a3:rgba(255,255,255,0.85);
  --ok:#ffffff; --warn:#ffe8b0; --err:#ffffff;
  --a1-t:rgba(255,232,176,0.18); --a1-b:#ffd16b;
  --a2-t:rgba(255,255,255,0.18); --a2-b:rgba(255,255,255,0.55);
  --a3-t:rgba(255,255,255,0.12); --a3-b:rgba(255,255,255,0.40);
  --ok-t:rgba(0,216,212,0.22); --ok-b:#00d8d4;
  --warn-t:rgba(255,209,107,0.22); --warn-b:#ffd16b;
  --err-t:rgba(255,91,157,0.22); --err-b:#ff5b9d;

  /* El vidrio se oscurece hacia abajo: el cuerpo del texto cae en la mitad
     inferior y ahí el degradado espectral puede aclararse demasiado. */
  --card-bg:linear-gradient(180deg, rgba(255,255,255,0.16) 0%, rgba(45,15,90,0.20) 100%);
  --border:rgba(255,255,255,0.32);
  --bw:1px; --rule-h:1px;
  --radius:18px; --radius-lg:20px;
  --shadow:0 14px 38px rgba(60,20,120,0.18), inset 0 1px 0 rgba(255,255,255,0.40);
  --shadow-sm:0 8px 22px rgba(60,20,120,0.14), inset 0 1px 0 rgba(255,255,255,0.30);
  --inset-bg:rgba(255,255,255,0.12); --inset-border:rgba(255,255,255,0.28);
  --hi-bg:rgba(255,255,255,0.20);
  --hairline:rgba(255,255,255,0.30);
  --zebra:rgba(255,255,255,0.06);
  --thead-bg:rgba(255,255,255,0.20);

  --code-bg:rgba(40,10,80,0.35); --code-fg:#ffffff;
  --c-kw:#ffe8b0; --c-fn:#ffffff; --c-str:#c9f7f5; --c-cm:rgba(255,255,255,0.60); --c-num:#ffd16b;

  --display:'Inter Tight','Inter',-apple-system,sans-serif;
  --display-xl:'Inter Tight','Inter',-apple-system,sans-serif;
  --body:'Inter',-apple-system,sans-serif;
  --mono:'Inter',-apple-system,sans-serif;
  --serif:'Instrument Serif','Fraunces',Georgia,serif;
  --title-shadow:0 4px 30px rgba(80,30,140,0.25);
  --em-family:var(--serif); --em-style:italic; --em-weight:400;
  --heavy:700;

  --mermaid-primary:rgba(255,255,255,0.16); --mermaid-text:#ffffff; --mermaid-border:rgba(255,255,255,0.45);
  --mermaid-line:rgba(255,255,255,0.6); --mermaid-secondary:rgba(255,255,255,0.10); --mermaid-tertiary:rgba(255,255,255,0.08);
}
{{SHARED_CSS}}

.h1,.h2,.h3,h1,h2,h3{letter-spacing:-0.045em;}
.tag,.kicker{letter-spacing:0.20em;font-weight:600;}
.card{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}

/* ============================================================
   DECORACIONES DE FIRMA DEL PACK
   Lavado de luz, trama de 64px, dos esferas de vidrio con
   especular y el filete de marquesina al pie.
   ============================================================ */
.deco-a{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    {{WASH}},
    radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size:auto, auto, auto, 64px 64px;}

/* Esfera grande: gradiente de seis paradas, sombra interior de volumen
   y un especular desplazado. Es la firma del pack. */
.deco-b{position:absolute;{{ORB_A}}border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 32% 28%,
    rgba(255,255,255,0.95) 0%, rgba(255,220,140,0.75) 18%, rgba(255,140,200,0.55) 38%,
    rgba(178,102,255,0.40) 58%, rgba(74,140,255,0.30) 78%, rgba(0,216,212,0.20) 92%, transparent 100%);
  box-shadow:inset -28px -32px 60px rgba(120,60,180,0.45), inset 12px 14px 36px rgba(255,255,255,0.35),
    0 40px 100px rgba(60,20,100,0.35), 0 0 80px rgba(255,180,220,0.30);}
.deco-b::before{content:'';position:absolute;top:12%;left:18%;width:25%;height:17%;border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.4) 40%, transparent 75%);}

/* Esfera fría y filete de marquesina. */
.deco-c{position:absolute;{{ORB_B}}border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,
    rgba(255,255,255,0.90) 0%, rgba(180,230,255,0.65) 22%, rgba(74,140,255,0.50) 50%,
    rgba(0,216,212,0.35) 75%, transparent 95%);
  box-shadow:inset -18px -22px 42px rgba(40,80,160,0.45), inset 8px 10px 24px rgba(255,255,255,0.30),
    0 28px 70px rgba(20,40,90,0.30), 0 0 60px rgba(120,200,255,0.30);}
.deco-c::before{content:'';position:absolute;top:16%;left:22%;width:27%;height:17%;border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.3) 45%, transparent 80%);}

.slide{background:{{BG}};}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
</script>
</body>
</html>
