<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS DEL PACK — ver theme-packs/TOKENS.md
   Gov Authority: papel oficial cálido, serif de tracking abierto,
   franjas rojo/azul en los bordes y escuadras de expediente.
   ============================================================ */
:root{
  --bg:#fffaf3; --bg2:#fdf3e3;
  --text:#1a1a1a; --text-sec:#3a3a3a; --text-ter:#6a6a6a;
  --strong:#1a1a1a;

  --a1:#c41e3a; --a2:#1a3a6e; --a3:#8b1721;
  --ok:#1e6e3a; --warn:#b8893a; --err:#8b1721;
  --a1-t:rgba(196,30,58,0.06); --a1-b:#c41e3a;
  --a2-t:rgba(26,58,110,0.06); --a2-b:#1a3a6e;
  --a3-t:rgba(139,23,33,0.07); --a3-b:#8b1721;
  --ok-t:rgba(30,110,58,0.08); --ok-b:#1e6e3a;
  --warn-t:rgba(184,137,58,0.10); --warn-b:#b8893a;
  --err-t:rgba(139,23,33,0.07); --err-b:#8b1721;

  --card-bg:rgba(255,255,255,0.55); --border:rgba(26,26,26,0.18);
  --bw:1px; --rule-h:1.5px;
  --radius:0px; --radius-lg:0px;
  --radius-sm:0px; --radius-pill:0px;
  --shadow:none; --shadow-sm:none;
  --inset-bg:#fdf3e3; --inset-border:rgba(26,26,26,0.18);
  --hi-bg:rgba(196,30,58,0.07);
  --hairline:rgba(26,26,26,0.18);
  --zebra:rgba(26,26,26,0.03);
  --thead-bg:rgba(26,58,110,0.12);

  --code-bg:#fdf3e3; --code-fg:#1a1a1a;
  --c-kw:#c41e3a; --c-fn:#1a3a6e; --c-str:#1e6e3a; --c-cm:#6a6a6a; --c-num:#b8893a;

  --display:'Noto Serif SC','Source Han Serif SC',Georgia,serif;
  --display-xl:'Noto Serif SC','Source Han Serif SC',Georgia,serif;
  --body:'Noto Sans SC','Inter',-apple-system,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --serif:'Noto Serif SC',Georgia,serif;
  --title-shadow:none;
  --em-family:var(--display); --em-style:normal; --em-weight:700;
  --heavy:700;

  --mermaid-primary:#fdf3e3; --mermaid-text:#1a1a1a; --mermaid-border:#c41e3a;
  --mermaid-line:#1a3a6e; --mermaid-secondary:#fffaf3; --mermaid-tertiary:#fdf3e3;
}
{{SHARED_CSS}}

/* El tracking ancho del original es de glifos CJK cuadrados; en español
   solo sobrevive en cadenas cortas, así que los títulos van a 0.10em y
   el 0.38em queda para etiquetas, chips y numeración. */
.h1,.h2,.h3,h1,h2,h3{letter-spacing:0.10em;}
.tag,.kicker{font-family:'Inter',sans-serif;font-weight:600;letter-spacing:0.38em;}
.slide-num{font-family:'Inter',sans-serif;font-weight:500;letter-spacing:0.32em;right:56px;}
.chip,.meta-chip{font-family:'Inter',sans-serif;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;border-radius:0;}

/* Filete doble bajo el encabezado, como el membrete del original. */
.divider{background:var(--text);opacity:0.85;}
.divider::after{content:'';position:absolute;left:0;right:0;top:4px;height:0.75px;background:var(--text);opacity:0.55;}

/* ============================================================
   DECORACIONES DE FIRMA DEL PACK
   Grano + calor de papel, escuadras de expediente y las franjas
   bicolor selladas en los bordes superior e inferior.
   ============================================================ */
.deco-a{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    {{WARMTH}},
    radial-gradient(circle, rgba(26,26,26,0.025) 1px, transparent 1px);
  background-size:auto, auto, 4px 4px;}
.deco-a::before,.deco-a::after{content:'';position:absolute;width:22px;height:22px;top:16px;}
.deco-a::before{left:20px;border-top:1.5px solid #c41e3a;border-left:1.5px solid #c41e3a;}
.deco-a::after{right:20px;border-top:1.5px solid #1a3a6e;border-right:1.5px solid #1a3a6e;}

.deco-b{position:absolute;inset:0;z-index:0;pointer-events:none;}
.deco-b::before,.deco-b::after{content:'';position:absolute;width:22px;height:22px;bottom:16px;}
.deco-b::before{left:20px;border-bottom:1.5px solid #1a3a6e;border-left:1.5px solid #1a3a6e;}
.deco-b::after{right:20px;border-bottom:1.5px solid #c41e3a;border-right:1.5px solid #c41e3a;}

/* Franjas de 6px selladas arriba y abajo, cada una con su filete de tinta. */
.deco-c{position:absolute;inset:0;z-index:6;pointer-events:none;
  background-repeat:no-repeat;
  background-image:
    linear-gradient(90deg,#c41e3a 0 {{SPLIT}}, #1a3a6e {{SPLIT}} 100%),
    linear-gradient(90deg,#1a3a6e 0 {{SPLIT}}, #c41e3a {{SPLIT}} 100%),
    linear-gradient(#1a1a1a,#1a1a1a),
    linear-gradient(#1a1a1a,#1a1a1a);
  background-size:100% 6px, 100% 6px, 100% 1px, 100% 1px;
  background-position:left top, left bottom, left 6px, left calc(100% - 7px);}

.slide{background:{{BG}};}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
</script>
</body>
</html>
