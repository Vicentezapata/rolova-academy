<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor de Presentación U4</title>
<script src="notas_orador.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    margin: 0;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
  }
  .toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: 48px;
    background: rgba(0,0,0,0.8); border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center; gap: 16px;
    z-index: 1000; backdrop-filter: blur(10px);
    opacity: 0; transition: opacity 0.3s;
  }
  .toolbar:hover, .toolbar:focus-within { opacity: 1; }
  
  :fullscreen .toolbar { display: none !important; }
  :fullscreen .nav-hint { display: none !important; }

  .toolbar button {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 6px 16px; border-radius: 6px; cursor: pointer;
    font-size: 14px; transition: background 0.2s;
  }
  .toolbar button:hover { background: rgba(255,255,255,0.2); }
  .toolbar button:disabled { opacity: 0.3; cursor: not-allowed; }
  .page-info { font-size: 14px; color: rgba(255,255,255,0.7); min-width: 80px; text-align: center; }
  
  .stage {
    width: 100vw;
    height: 100vh;
    max-width: 100vw;
    max-height: 100vh;
    overflow: hidden;
    position: relative;
    background: #000;
  }
  
  .slide-wrap {
    visibility: hidden;
    opacity: 0;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transition: opacity 0.2s;
  }
  
  /* Overview Mode */
  .stage.overview {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 24px;
    align-content: flex-start;
    justify-content: center;
    overflow-y: auto;
    background: transparent;
    box-shadow: none;
    aspect-ratio: auto;
    height: calc(100vh - 60px);
  }
  .stage.overview .slide-wrap {
    display: block !important;
    position: relative;
    width: 256px; height: 144px;
    cursor: pointer;
    border: 2px solid transparent;
    border-radius: 8px;
    overflow: hidden;
    transition: border 0.2s, transform 0.2s;
  }
  .stage.overview .slide-wrap:hover {
    border-color: #22D3EE;
    transform: scale(1.05);
  }
  .stage.overview .slide-wrap.active {
    border-color: #6366f1;
  }
  .stage.overview .slide-frame {
    transform: scale(0.2) !important;
    pointer-events: none;
  }
  
  .slide-frame {
    width: 1280px; height: 720px;
    transform-origin: center center;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: none;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  
  
  .nav-hint {
    position: fixed; bottom: 12px;
    color: rgba(255,255,255,0.25); font-size: 12px;
  }
</style>
</head>
<body>

<div class="toolbar">
  <button id="btn-prev" onclick="nav(-1)">Prev</button>
  <span class="page-info" id="page-info">1 / 26</span>
  <button id="btn-next" onclick="nav(1)">Next</button>
  <div style="width:1px;height:16px;background:rgba(255,255,255,0.2);margin:0 8px"></div>
  <button onclick="toggleOverview()">Grid</button>
  <button onclick="document.documentElement.requestFullscreen()">FS</button>
  <button onclick="openPresenter()">Presenter</button>
</div>

<div class="stage" id="stage">
  <div class="slide-wrap" id="wrap-0" onclick="if(isOverview) { toggleOverview(); show(0); }"><iframe class="slide-frame" id="slide-0" src="slides/slide_00.html"></iframe></div>
  <div class="slide-wrap" id="wrap-1" onclick="if(isOverview) { toggleOverview(); show(1); }"><iframe class="slide-frame" id="slide-1" src="slides/slide_01.html"></iframe></div>
  <div class="slide-wrap" id="wrap-2" onclick="if(isOverview) { toggleOverview(); show(2); }"><iframe class="slide-frame" id="slide-2" src="slides/slide_02.html"></iframe></div>
  <div class="slide-wrap" id="wrap-3" onclick="if(isOverview) { toggleOverview(); show(3); }"><iframe class="slide-frame" id="slide-3" src="slides/slide_03.html"></iframe></div>
  <div class="slide-wrap" id="wrap-4" onclick="if(isOverview) { toggleOverview(); show(4); }"><iframe class="slide-frame" id="slide-4" src="slides/slide_04.html"></iframe></div>
  <div class="slide-wrap" id="wrap-5" onclick="if(isOverview) { toggleOverview(); show(5); }"><iframe class="slide-frame" id="slide-5" src="slides/slide_05.html"></iframe></div>
  <div class="slide-wrap" id="wrap-6" onclick="if(isOverview) { toggleOverview(); show(6); }"><iframe class="slide-frame" id="slide-6" src="slides/slide_06.html"></iframe></div>
  <div class="slide-wrap" id="wrap-7" onclick="if(isOverview) { toggleOverview(); show(7); }"><iframe class="slide-frame" id="slide-7" src="slides/slide_07.html"></iframe></div>
  <div class="slide-wrap" id="wrap-8" onclick="if(isOverview) { toggleOverview(); show(8); }"><iframe class="slide-frame" id="slide-8" src="slides/slide_08.html"></iframe></div>
  <div class="slide-wrap" id="wrap-9" onclick="if(isOverview) { toggleOverview(); show(9); }"><iframe class="slide-frame" id="slide-9" src="slides/slide_09.html"></iframe></div>
  <div class="slide-wrap" id="wrap-10" onclick="if(isOverview) { toggleOverview(); show(10); }"><iframe class="slide-frame" id="slide-10" src="slides/slide_10.html"></iframe></div>
  <div class="slide-wrap" id="wrap-11" onclick="if(isOverview) { toggleOverview(); show(11); }"><iframe class="slide-frame" id="slide-11" src="slides/slide_11.html"></iframe></div>
  <div class="slide-wrap" id="wrap-12" onclick="if(isOverview) { toggleOverview(); show(12); }"><iframe class="slide-frame" id="slide-12" src="slides/slide_12.html"></iframe></div>
  <div class="slide-wrap" id="wrap-13" onclick="if(isOverview) { toggleOverview(); show(13); }"><iframe class="slide-frame" id="slide-13" src="slides/slide_13.html"></iframe></div>
  <div class="slide-wrap" id="wrap-14" onclick="if(isOverview) { toggleOverview(); show(14); }"><iframe class="slide-frame" id="slide-14" src="slides/slide_14.html"></iframe></div>
  <div class="slide-wrap" id="wrap-15" onclick="if(isOverview) { toggleOverview(); show(15); }"><iframe class="slide-frame" id="slide-15" src="slides/slide_15.html"></iframe></div>
  <div class="slide-wrap" id="wrap-16" onclick="if(isOverview) { toggleOverview(); show(16); }"><iframe class="slide-frame" id="slide-16" src="slides/slide_16.html"></iframe></div>
  <div class="slide-wrap" id="wrap-17" onclick="if(isOverview) { toggleOverview(); show(17); }"><iframe class="slide-frame" id="slide-17" src="slides/slide_17.html"></iframe></div>
  <div class="slide-wrap" id="wrap-18" onclick="if(isOverview) { toggleOverview(); show(18); }"><iframe class="slide-frame" id="slide-18" src="slides/slide_18.html"></iframe></div>
  <div class="slide-wrap" id="wrap-19" onclick="if(isOverview) { toggleOverview(); show(19); }"><iframe class="slide-frame" id="slide-19" src="slides/slide_19.html"></iframe></div>
  <div class="slide-wrap" id="wrap-20" onclick="if(isOverview) { toggleOverview(); show(20); }"><iframe class="slide-frame" id="slide-20" src="slides/slide_20.html"></iframe></div>
  <div class="slide-wrap" id="wrap-21" onclick="if(isOverview) { toggleOverview(); show(21); }"><iframe class="slide-frame" id="slide-21" src="slides/slide_21.html"></iframe></div>
  <div class="slide-wrap" id="wrap-22" onclick="if(isOverview) { toggleOverview(); show(22); }"><iframe class="slide-frame" id="slide-22" src="slides/slide_22.html"></iframe></div>
  <div class="slide-wrap" id="wrap-23" onclick="if(isOverview) { toggleOverview(); show(23); }"><iframe class="slide-frame" id="slide-23" src="slides/slide_23.html"></iframe></div>
  <div class="slide-wrap" id="wrap-24" onclick="if(isOverview) { toggleOverview(); show(24); }"><iframe class="slide-frame" id="slide-24" src="slides/slide_24.html"></iframe></div>
  <div class="slide-wrap" id="wrap-25" onclick="if(isOverview) { toggleOverview(); show(25); }"><iframe class="slide-frame" id="slide-25" src="slides/slide_25.html"></iframe></div>

</div>
<div class="nav-hint" id="nav-hint">Use Left/Right arrows or Space to navigate. ESC to exit fullscreen.</div>

<script>
  let cur = 0;
  const total = 26;
  let isOverview = false;
  const bc = new BroadcastChannel('ppt_channel');

  
  function fitSlides() {
    if (isOverview) {
      document.querySelectorAll('.slide-frame').forEach(el => el.style.transform = '');
      return;
    }
    const stage = document.getElementById('stage');
    const sw = stage.clientWidth;
    const sh = stage.clientHeight;
    // Mobile friendly scale (downscale only, or upscale if desired)
    const scale = Math.min(sw / 1280, sh / 720);
    document.querySelectorAll('.slide-frame').forEach(el => {
      el.style.transform = `translate(-50%, -50%) scale(${scale})`;
    });
  }
  window.addEventListener('resize', fitSlides);
  // Call once initially
  setTimeout(fitSlides, 100);

  function show(idx) {
    document.querySelectorAll('.slide-wrap').forEach((el, i) => {
      if (isOverview) {
        el.style.position = 'relative';
        el.style.visibility = 'visible';
        el.style.opacity = '1';
        if (i === idx) el.classList.add('active');
        else el.classList.remove('active');
      } else {
        el.style.position = 'absolute';
        if (i === idx) {
            el.style.visibility = 'visible';
            el.style.opacity = '1';
            el.style.zIndex = 10;
        } else {
            el.style.visibility = 'hidden';
            el.style.opacity = '0';
            el.style.zIndex = 1;
        }
        el.classList.remove('active');
      }
    });
    document.getElementById('page-info').innerText = (idx + 1) + " / " + total;
    document.getElementById('btn-prev').disabled = idx === 0;
    document.getElementById('btn-next').disabled = idx === total - 1;
    bc.postMessage({ type: 'goto', idx: idx });
  }

  function nav(dir) {
    let next = cur + dir;
    if (next >= 0 && next < total) {
      cur = next;
      show(cur);
    }
  }

  function toggleOverview() {
    isOverview = !isOverview;
    fitSlides();
    const stage = document.getElementById('stage');
    if (isOverview) {
      stage.classList.add('overview');
      document.getElementById('nav-hint').style.display = 'none';
    } else {
      stage.classList.remove('overview');
      document.getElementById('nav-hint').style.display = 'block';
    }
    show(cur);
  }

  document.addEventListener('keydown', e => {
    let k = e.key.toLowerCase();
    if (['arrowleft', 'arrowup', 'arrowright', 'arrowdown', ' '].includes(k)) e.preventDefault();
    if (k === 'arrowleft' || k === 'arrowup') nav(-1);
    if (k === 'arrowright' || k === 'arrowdown' || k === ' ') nav(1);
    if (k === 'o') toggleOverview();
    if (k === 's') openPresenter();
    if (k === 'f') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => {});
      else document.exitFullscreen();
    }
  });

  // Listen for messages from iframes
  window.addEventListener('message', e => {
    if (e.data && e.data.type === 'forward-key') {
      let k = e.data.key.toLowerCase();
      if (k === 'arrowleft' || k === 'arrowup') nav(-1);
      if (k === 'arrowright' || k === 'arrowdown' || k === ' ') nav(1);
      if (k === 'o') toggleOverview();
      if (k === 's') openPresenter();
      if (k === 'f') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => {});
        else document.exitFullscreen();
      }
    }
  });

  // Listen for presenter sync
  bc.onmessage = e => {
    if (e.data.type === 'goto' && e.data.idx !== cur) {
      cur = e.data.idx;
      show(cur);
    }
  };

  show(cur);

  function openPresenter() {
    window.open('presenter.html', 'presenter', 'width=1280,height=820,menubar=no,toolbar=no');
  }
</script>
</body>
</html>
