<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Slide 00 — Portada</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>


:root{
  --bg:#050b1f;--bg2:#0a1f3d;--card-from:rgba(34,211,238,0.08);--card-to:rgba(99,102,241,0.04);
  --border:rgba(34,211,238,0.2);--text:#ffffff;--text-sec:rgba(255,255,255,0.65);
  --accent1:#22D3EE;--accent2:#6366f1;--accent3:#FDE047;--radius:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Inter Tight',sans-serif;background:var(--bg);}
.slide{width:100%;height:100%;position:relative;overflow:hidden;background:radial-gradient(100% 80% at 70% 120%, #0c1b4a 0%, var(--bg) 80%);}
.grid-texture{position:absolute;inset:0;z-index:1;background-image:radial-gradient(rgba(99,102,241,0.08) 1px,transparent 1px);background-size:40px 40px;}
.glow1{position:absolute;width:400px;height:400px;border-radius:50%;background:rgba(99,102,241,0.2);filter:blur(60px);top:-80px;right:320px;z-index:1;}
.glow2{position:absolute;width:400px;height:400px;border-radius:50%;background:rgba(99,102,241,0.2);filter:blur(60px);bottom:-60px;left:80px;z-index:1;}
.content{position:relative;z-index:10;padding:60px 80px;display:flex;flex-direction:column;justify-content:center;height:100%;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(34,211,238,0.12);border:1px solid rgba(34,211,238,0.35);color:var(--accent1);padding:8px 18px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;margin-bottom:28px;width:fit-content;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent1);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.7);}}
.title{font-family:'Inter Tight','Inter',sans-serif;font-size:56px;font-weight:800;line-height:1.1;letter-spacing:-0.045em;color:var(--text);margin-bottom:20px;}
.title em{font-family:'Instrument Serif',Georgia,serif;font-style:italic;color:var(--accent1);}
.subtitle{font-size:17px;color:var(--text-sec);line-height:1.7;max-width:580px;letter-spacing:-0.005em;margin-bottom:44px;}
.meta-row{display:flex;align-items:center;gap:20px;}
.meta-chip{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);padding:7px 16px;border-radius:6px;font-size:12px;color:var(--text-sec);letter-spacing:0.05em;font-family:'JetBrains Mono',monospace;}
.meta-chip.accent{background:rgba(99,102,241,0.2);border-color:rgba(99,102,241,0.4);color:#a5b4fc;}
.corner-tl{position:absolute;top:32px;left:32px;z-index:10;}
.corner-tl svg{opacity:0.4;}
.slide-num{position:absolute;bottom:36px;right:48px;font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,0.25);letter-spacing:0.1em;z-index:10;}
.bg-img{position:absolute;inset:0;background-size:cover;background-position:center right;opacity:0.25;z-index:0;}
.bg-overlay{position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 40%,transparent 100%);z-index:1;}


</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<div class="slide">
<div class="bg-img" style="background-image:url('../images/cover.png')"></div>
<div class="bg-overlay"></div>
      <div class="grid-texture"></div>
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="corner-tl">
    <lord-icon src="https://cdn.lordicon.com/wxnxiano.json" trigger="loop" delay="2000" colors="primary:#22d3ee" style="width:40px;height:40px;transform:rotate(315deg)"></lord-icon>
  </div>
  <div class="content">
    <div class="eyebrow"><div class="dot"></div>IF203IINF &nbsp;·&nbsp; IPSS &nbsp;·&nbsp; 2026</div>
    <h1 class="title">Unidad 2<br><em>Planificación</em><br>de Pruebas</h1>
    <p class="subtitle">Estrategia, diseño y documentación de pruebas de software. Desde la selección contextual de tipos de prueba hasta el Plan Maestro IEEE 829.</p>
    <div class="meta-row">
      <div class="meta-chip accent">4 Sesiones</div>
      <div class="meta-chip accent">21 Slides</div>
      <div class="meta-chip">Gherkin · RTM · Test Plan · INVEST</div>
    </div>
  </div>
  <div class="slide-num">00 / 20</div>
</div>
</body>
</html>
