<div class="nav-hint">
  <b>&larr; &rarr;</b> Nav | <b>+ / -</b> Zoom | <b>S</b> Speaker Notes | <b>F</b> Fullscreen | <b>T</b> Toggle Theme | <b>O</b> Overview
</div>

<script>
  let cur = 0;
  const frames = document.querySelectorAll('.slide-frame');
  const wraps = document.querySelectorAll('.slide-wrap');
  const total = frames.length;
  const info = document.getElementById('page-info');
  const CHANNEL_NAME = 'html-ppt-presenter-U2';
  let bc;
  try { bc = new BroadcastChannel(CHANNEL_NAME); } catch(e) {}
  
  const slideMeta = [{"title": "Slide 00 \u2014 Portada", "notes": ""}, {"title": "Slide 01 \u2014 Tabla de Contenidos", "notes": ""}, {"title": "Slide 02 \u2014 Secci\u00f3n 1", "notes": ""}, {"title": "Slide 03 \u2014 El Principio del Contexto", "notes": ""}, {"title": "Slide 04 \u2014 Matriz de Riesgo", "notes": ""}, {"title": "Slide 05 \u2014 Actividad: El Estratega", "notes": ""}, {"title": "Slide 06 \u2014 Secci\u00f3n 2", "notes": ""}, {"title": "Slide 07 \u2014 SRS vs User Stories", "notes": ""}, {"title": "Slide 08 \u2014 INVEST + Gherkin BDD", "notes": ""}, {"title": "Slide 09 \u2014 Actividad: El Traductor \u00c1gil", "notes": ""}, {"title": "Slide 10 \u2014 Secci\u00f3n 3", "notes": ""}, {"title": "Slide 11 \u2014 Anatom\u00eda del Test Case", "notes": ""}, {"title": "Slide 12 \u2014 RTM", "notes": ""}, {"title": "Slide 13 \u2014 Actividad: Disecci\u00f3n del Bug", "notes": ""}, {"title": "Slide 14 \u2014 Secci\u00f3n 4", "notes": ""}, {"title": "Slide 15 \u2014 IEEE 829 Test Plan", "notes": ""}, {"title": "Slide 16 \u2014 Din\u00e1micas Sincr\u00f3nicas", "notes": ""}, {"title": "Slide 17 \u2014 Cierre Unidad 2", "notes": ""}, {"title": "Slide 18 \u2014 Contexto de Evaluaci\u00f3n 2", "notes": ""}, {"title": "Slide 19 \u2014 Partes de la Evaluaci\u00f3n", "notes": ""}, {"title": "Slide 20 \u2014 R\u00fabrica y Entregables", "notes": ""}];
  let presenterWin = null;
  let currentTheme = 'dark';
  let isOverview = false;
  
  function resize() {
    if(isOverview) return;
    const stage = document.getElementById('stage');
    // Main view is now fully responsive, no scale transform needed
    frames.forEach(f => f.style.transform = 'none');
    
    // Also center the iframes within the slide-wrap to avoid top cutoff
    wraps.forEach(w => {
      w.style.alignItems = 'center';
      w.style.justifyContent = 'center';
    });
  }
  window.addEventListener('resize', resize);
  resize();
  show(0);
  
  if(bc) bc.onmessage = e => {
    if(e.data.type === 'goto') show(e.data.idx);
  };

  function show(i) {
    if(isOverview) {
      wraps.forEach((w, idx) => {
        w.classList.toggle('active', idx === i);
      });
      cur = i;
      return;
    }
    wraps.forEach((w, idx) => w.style.display = idx === i ? 'flex' : 'none');
    if(info) {
      info.innerText = `${i + 1} / ${total}`;
      document.getElementById('btn-prev').disabled = i === 0;
      document.getElementById('btn-next').disabled = i === total - 1;
    }
    cur = i;
    resize();
  }
  
  function nav(d) {
    const n = cur + d;
    if (n >= 0 && n < total) { 
      show(n);
      if(bc) bc.postMessage({ type: 'goto', idx: n });
    }
  }

  // Keyboard Shortcuts
  document.addEventListener('keydown', e => {
    handleKey(e.key);
  });
  
  window.addEventListener('message', e => {
    if(e.data && e.data.type === 'forward-key') {
      handleKey(e.data.key);
    }
  });

  function handleKey(key) {
    let kL = key.toLowerCase();
    if (key === 'ArrowLeft' || key === 'ArrowUp') nav(-1);
    if (key === 'ArrowRight' || key === 'ArrowDown' || key === ' ') nav(1);
    if (kL === 'f') fullscreen();
    if (kL === 's') openPresenterWindow();
    if (kL === 't') toggleTheme();
    if (kL === 'o') toggleOverview();
    if (key === '+' || key === '=') adjustZoom(1);
    if (key === '-') adjustZoom(-1);
    if (key === '0') adjustZoom(0);
  }

  let zoomLevel = 0;
  function adjustZoom(delta) {
    if (delta === 0) {
      zoomLevel = 0;
    } else {
      zoomLevel += delta;
    }
    const stage = document.getElementById('stage');
    if (zoomLevel > 0) {
      stage.style.maxWidth = 'none';
      stage.style.maxHeight = 'none';
      stage.style.width = (100 + zoomLevel * 20) + 'vw';
      stage.style.height = 'auto';
      document.body.style.overflow = 'auto'; // allow scrolling
    } else if (zoomLevel < 0) {
      stage.style.maxWidth = '100vw';
      stage.style.maxHeight = '100vh';
      stage.style.width = Math.max(30, 100 + zoomLevel * 10) + 'vw';
      stage.style.height = 'auto';
      document.body.style.overflow = 'hidden';
    } else {
      stage.style.maxWidth = '';
      stage.style.maxHeight = '';
      stage.style.width = '';
      stage.style.height = '';
      document.body.style.overflow = 'hidden';
    }
    setTimeout(resize, 10);
  }


  function toggleOverview() {
    isOverview = !isOverview;
    const stage = document.getElementById('stage');
    if(isOverview) {
      stage.classList.add('overview');
      show(cur);
    } else {
      stage.classList.remove('overview');
      show(cur);
    }
  }

  function fullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {});
    } else {
      document.exitFullscreen();
    }
  }

  function toggleTheme() {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    frames.forEach(f => {
        try {
            let doc = f.contentDocument || f.contentWindow.document;
            if (currentTheme === 'light') {
                doc.documentElement.style.setProperty('--bg', '#f8fafc');
                doc.documentElement.style.setProperty('--bg2', '#f1f5f9');
                doc.documentElement.style.setProperty('--text', '#0f172a');
            } else {
                // Restore dark
                doc.documentElement.style.setProperty('--bg', '#050b1f');
                doc.documentElement.style.setProperty('--bg2', '#0a1f3d');
                doc.documentElement.style.setProperty('--text', '#ffffff');
            }
        } catch(e) {}
    });
    if(bc) bc.postMessage({ type: 'theme', name: currentTheme });
  }

  /* ==============================================================
   * Presenter Window Logic (Imported from html-ppt-skill)
   * ============================================================== */
  function openPresenterWindow() {
    if (presenterWin && !presenterWin.closed) {
      presenterWin.focus();
      return;
    }
    presenterWin = window.open('', 'html-ppt-presenter-u2', 'width=1280,height=820,menubar=no,toolbar=no');
    if (!presenterWin) {
      alert('Pop-up blocked. Please allow popups for this site.');
      return;
    }
    
    // Collect srcdocs to bypass file:// CORS
    const srcdocs = Array.from(frames).map(f => f.getAttribute('srcdoc'));
    
    presenterWin.document.open();
    presenterWin.document.write(getPresenterTemplate());
    presenterWin.document.close();
    
    // Inject data directly to the new window
    presenterWin.slideMeta = slideMeta;
    presenterWin.slideSrcdocs = srcdocs;
    presenterWin.total = total;
    presenterWin.idx = cur;
    presenterWin.channelName = CHANNEL_NAME;
    presenterWin.speakerNotes = window.speakerNotes || {};
    
    // Wait for popup DOM to finish parsing then initialize
    setTimeout(() => {
      if(presenterWin.initPresenter) presenterWin.initPresenter();
    }, 100);
  }

  function getPresenterTemplate() {
    return `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Presenter View - U2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #1a1d24; color: #e6edf3;
    font-family: -apple-system, sans-serif;
  }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  
  .pcard {
    position: absolute; background: #0d1117;
    border: 1px solid rgba(255,255,255,.1); border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,.45); display: flex; flex-direction: column;
    overflow: hidden; min-width: 180px; min-height: 100px;
  }
  .pcard-head {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: rgba(255,255,255,.04); border-bottom: 1px solid rgba(255,255,255,.06);
    cursor: move; user-select: none; flex-shrink: 0;
  }
  .pcard-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot-color, #58a6ff); }
  .pcard-title { font-size: 11px; font-weight: 700; color: #8b949e; flex: 1; letter-spacing: .15em; }
  
  .pcard-body { flex: 1; position: relative; overflow: hidden; min-height: 0; }
  
  .pcard-preview .pcard-body { background: #000; }
  .pcard-preview iframe {
    position: absolute; top: 0; left: 0; width: 1280px; height: 720px; border: none;
    transform-origin: top left;
  }
  
  .pcard-notes .pcard-body { padding: 14px 18px; overflow-y: auto; font-size: 18px; line-height: 1.75; }
  .pcard-notes .pcard-body strong { color: #f0883e; }
  
  .pcard-timer .pcard-body { display: flex; flex-direction: column; gap: 14px; padding: 18px 20px; justify-content: center; }
  .timer-display { font-size: 42px; font-weight: 700; color: #3fb950; line-height: 1; }
  .timer-row { display: flex; gap: 12px; font-size: 14px; color: #8b949e; }
  .timer-controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .timer-btn {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    color: #e6edf3; padding: 6px 12px; border-radius: 6px; cursor: pointer;
  }
  .pcard-resize {
    position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize;
    z-index: 5;
  }
</style>
</head>
<body>
<div id="stage">
  <div class="pcard pcard-preview" id="card-cur" style="--dot-color:#58a6ff">
    <div class="pcard-head" data-drag><span class="pcard-dot"></span><span class="pcard-title">CURRENT</span></div>
    <div class="pcard-body"><iframe id="iframe-cur"></iframe></div>
    <div class="pcard-resize" data-resize></div>
  </div>
  <div class="pcard pcard-preview" id="card-nxt" style="--dot-color:#bc8cff">
    <div class="pcard-head" data-drag><span class="pcard-dot"></span><span class="pcard-title">NEXT</span></div>
    <div class="pcard-body"><iframe id="iframe-nxt"></iframe></div>
    <div class="pcard-resize" data-resize></div>
  </div>
  <div class="pcard pcard-notes" id="card-notes" style="--dot-color:#f0883e">
    <div class="pcard-head" data-drag><span class="pcard-dot"></span><span class="pcard-title">SPEAKER SCRIPT</span></div>
    <div class="pcard-body" id="notes-body"></div>
    <div class="pcard-resize" data-resize></div>
  </div>
  <div class="pcard pcard-timer" id="card-timer" style="--dot-color:#3fb950">
    <div class="pcard-head" data-drag><span class="pcard-dot"></span><span class="pcard-title">TIMER</span></div>
    <div class="pcard-body">
      <div class="timer-display" id="timer-display">00:00</div>
      <div class="timer-row">Slide <span id="timer-count"></span></div>
      <div class="timer-controls">
        <button class="timer-btn" id="btn-prev">Prev</button>
        <button class="timer-btn" id="btn-next">Next</button>
        <button class="timer-btn" id="btn-reset">Reset</button>
      </div>
    </div>
    <div class="pcard-resize" data-resize></div>
  </div>
</div>
<script>
  function initPresenter() {
    let bc; try { bc = new BroadcastChannel(window.channelName); } catch(e){}
    
    function initLayout() {
      // Provide fallback dimensions in case popup window hasn't laid out yet
      let w = window.innerWidth || 1280;
      let h = window.innerHeight || 820;
      if (w < 100 || h < 100) { w = 1280; h = 820; } // aggressive fallback
      document.getElementById('card-cur').style.cssText = \`left: 16px; top: 16px; width: \${w*0.55 - 24}px; height: \${h*0.62 - 16}px\`;
      document.getElementById('card-nxt').style.cssText = \`left: \${w*0.55 + 8}px; top: 16px; width: \${w - w*0.55 - 24}px; height: \${h*0.42 - 16}px\`;
      document.getElementById('card-notes').style.cssText = \`left: \${w*0.55 + 8}px; top: \${h*0.42 + 8}px; width: \${w - w*0.55 - 24}px; height: \${h - h*0.42 - 16}px\`;
      document.getElementById('card-timer').style.cssText = \`left: 16px; top: \${h*0.62 + 8}px; width: \${w*0.55 - 24}px; height: \${h - h*0.62 - 16}px\`;
    }
    // Delay initialization slightly to ensure window layout is ready
    requestAnimationFrame(() => {
      initLayout();
    
    let iframeCur = document.getElementById('iframe-cur');
    let iframeNxt = document.getElementById('iframe-nxt');
    
    function fitIframe(iframe) {
        let cw = iframe.parentElement.clientWidth;
        let ch = iframe.parentElement.clientHeight;
        let scale = Math.min(cw/1280, ch/720);
        iframe.style.transform = \`scale(\${scale})\`;
    }
    
    function renderState() {
      document.getElementById('timer-count').innerText = (window.idx+1) + " / " + window.total;
      let n = window.speakerNotes && window.speakerNotes[window.idx];
      document.getElementById('notes-body').innerHTML = n || '<span style="color:#6e7681;font-style:italic">Sin guion</span>';
      
      iframeCur.srcdoc = window.slideSrcdocs[window.idx];
      let nxt = window.idx + 1 < window.total ? window.idx + 1 : window.idx;
      iframeNxt.srcdoc = window.slideSrcdocs[nxt];
      
      setTimeout(() => {
          fitIframe(iframeCur);
          fitIframe(iframeNxt);
      }, 50);
      
      if(bc) bc.postMessage({ type: 'goto', idx: window.idx });
    }
    
    window.addEventListener('resize', () => {
        fitIframe(iframeCur);
        fitIframe(iframeNxt);
    });
    
    document.getElementById('btn-prev').onclick = () => { if(window.idx>0){ window.idx--; renderState(); } };
    document.getElementById('btn-next').onclick = () => { if(window.idx<window.total-1){ window.idx++; renderState(); } };
    
    if(bc) bc.onmessage = e => {
      if(e.data.type === 'goto') { window.idx = e.data.idx; renderState(); }
      // theme overrides could be applied here if needed
    };
    
    let startT = Date.now();
    let timerEl = document.getElementById('timer-display');
    setInterval(() => {
      let diff = Math.floor((Date.now() - startT)/1000);
      let m = Math.floor(diff/60).toString().padStart(2,'0');
      let s = (diff%60).toString().padStart(2,'0');
      timerEl.innerText = m + ':' + s;
    }, 1000);
    document.getElementById('btn-reset').onclick = () => { startT = Date.now(); };
    
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { if(window.idx>0){ window.idx--; renderState(); } }
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { if(window.idx<window.total-1){ window.idx++; renderState(); } }
    });
    
    document.querySelectorAll('[data-drag]').forEach(h => {
      h.onmousedown = e => {
        let card = h.closest('.pcard');
        let stX = e.clientX, stY = e.clientY;
        let startL = parseInt(card.style.left) || 0, startT = parseInt(card.style.top) || 0;
        card.style.zIndex = 999;
        function onMove(ev) {
          card.style.left = (startL + ev.clientX - stX) + 'px';
          card.style.top = (startT + ev.clientY - stY) + 'px';
        }
        function onUp() { card.style.zIndex = ''; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      };
    });
    
    document.querySelectorAll('[data-resize]').forEach(h => {
      h.onmousedown = e => {
        let card = h.closest('.pcard');
        e.stopPropagation(); e.preventDefault();
        let stX = e.clientX, stY = e.clientY;
        let startW = parseInt(card.style.width) || card.offsetWidth, startH = parseInt(card.style.height) || card.offsetHeight;
        card.style.zIndex = 999;
        function onMove(ev) {
          card.style.width = Math.max(180, startW + ev.clientX - stX) + 'px';
          card.style.height = Math.max(100, startH + ev.clientY - stY) + 'px';
          fitIframe(card.querySelector('iframe'));
        }
        function onUp() { card.style.zIndex = ''; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      };
    });
    
    renderState();
    }); // end requestAnimationFrame
  }
<\/script>
</body>
</html>`;
  }
</script>
