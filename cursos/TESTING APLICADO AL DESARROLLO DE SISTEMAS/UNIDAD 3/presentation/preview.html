<title>Visor de Presentación</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    margin: 0;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
  }
  .toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: 60px;
    background: rgba(10, 6, 18, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(155,100,255,0.4);
    display: flex; align-items: center; justify-content: center; gap: 16px;
    z-index: 10000; 
    top: -80px; transition: top 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  /* Top bar oculta (hover) */
  #top-trigger { position: fixed; top:0; left:0; right:0; height:40px; z-index:9999; }
  #top-trigger:hover + .toolbar, .toolbar:hover { top: 0; }
  
  :fullscreen .toolbar, :fullscreen #top-trigger { display: none !important; }

  .toolbar button {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer;
    font-size: 14px; transition: background 0.2s; display:flex; align-items:center; gap:8px;
    font-weight:600;
  }
  .toolbar button:hover { background: rgba(155,100,255,0.3); border-color: rgba(155,100,255,0.6); }
  .toolbar button:disabled { opacity: 0.3; cursor: not-allowed; }
  .page-info { font-size: 14px; font-weight:700; color: #c4a8ff; min-width: 80px; text-align: center; font-family:monospace; }
  
  .stage {
    width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh;
    overflow: hidden; position: relative; background: #000;
  }
  
  .slide-wrap {
    visibility: hidden; opacity: 0;
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    transition: opacity 0.2s;
  }
  
  /* Overview Mode */
  .stage.overview {
    display: flex; flex-wrap: wrap; gap: 16px; padding: 24px;
    align-content: flex-start; justify-content: center;
    overflow-y: auto; background: rgba(10, 6, 18, 0.95); box-shadow: none;
    height: 100vh;
  }
  .stage.overview .slide-wrap {
    display: block !important; position: relative;
    width: 320px; height: 180px; cursor: pointer;
    border: 2px solid rgba(155,100,255,0.2); border-radius: 8px;
    overflow: hidden; transition: all 0.2s;
  }
  .stage.overview .slide-wrap:hover {
    border-color: #9b64ff; transform: scale(1.05); box-shadow: 0 10px 30px rgba(155,100,255,0.4);
  }
  .stage.overview .slide-wrap.active {
    border-color: #10b981; box-shadow: 0 0 20px rgba(16,185,129,0.4);
  }
  .stage.overview .slide-frame {
    transform: scale(0.25) !important; pointer-events: none;
  }
  
  .slide-frame {
    width: 1280px; height: 720px;
    transform-origin: top left;
    position: absolute; border: none;
    transition: transform 0.2s;
  }
</style>
</head>
<body>

<div id="top-trigger"></div>
<div class="toolbar">
  <button id="btn-prev" onclick="nav(-1)"><i data-lucide="chevron-left" style="width:18px;"></i> Prev</button>
  <span class="page-info" id="page-info">1 / 55</span>
  <button id="btn-next" onclick="nav(1)">Next <i data-lucide="chevron-right" style="width:18px;"></i></button>
  <div style="width:1px;height:20px;background:rgba(255,255,255,0.2);margin:0 8px"></div>
  <button onclick="toggleOverview()"><i data-lucide="layout-grid" style="width:18px;"></i> Grid (O)</button>
  <button onclick="document.documentElement.requestFullscreen()"><i data-lucide="maximize" style="width:18px;"></i> FS (F)</button>
  <button onclick="toggleTheme()"><i data-lucide="moon" style="width:18px;" id="theme-icon"></i> Theme (T)</button>
  <button onclick="openPresenter()"><i data-lucide="monitor-play" style="width:18px;"></i> Presenter (S)</button>
</div>

<script>
  lucide.createIcons();
  let cur = 0;
  const total = 55;
  let isOverview = false;
  const bc = new BroadcastChannel('ppt_channel');
  
  function fitSlides() {
    if (isOverview) {
      document.querySelectorAll('.slide-frame').forEach(el => el.style.transform = '');
      return;
    }
    const stage = document.getElementById('stage');
    const sw = stage.clientWidth;
    const sh = stage.clientHeight;
    const scale = Math.min(sw / 1280, sh / 720);
    const top = (sh - 720 * scale) / 2;
    const left = (sw - 1280 * scale) / 2;
    
    document.querySelectorAll('.slide-frame').forEach(el => {
      el.style.transform = `scale(${scale})`;
      el.style.top = top + 'px';
      el.style.left = left + 'px';
    });
  }
  window.addEventListener('resize', fitSlides);
  setTimeout(fitSlides, 100);

  function show(idx) {
    document.querySelectorAll('.slide-wrap').forEach((el, i) => {
      if (isOverview) {
        el.style.position = 'relative';
        el.style.visibility = 'visible';
        el.style.opacity = '1';
        if (i === idx) el.classList.add('active');
        else el.classList.remove('active');
      } else {
        el.style.position = 'absolute';
        if (i === idx) {
            el.style.visibility = 'visible';
            el.style.opacity = '1';
            el.style.zIndex = 10;
        } else {
            el.style.visibility = 'hidden';
            el.style.opacity = '0';
            el.style.zIndex = 1;
        }
        el.classList.remove('active');
      }
    });
    document.getElementById('page-info').innerText = (idx + 1) + " / " + total;
    document.getElementById('btn-prev').disabled = idx === 0;
    document.getElementById('btn-next').disabled = idx === total - 1;
    bc.postMessage({ type: 'goto', idx: idx });
  }

  function nav(dir) {
    let next = cur + dir;
    if (next >= 0 && next < total) {
      cur = next;
      show(cur);
    }
  }

  function toggleOverview() {
    isOverview = !isOverview;
    fitSlides();
    const stage = document.getElementById('stage');
    if (isOverview) {
      stage.classList.add('overview');
    } else {
      stage.classList.remove('overview');
    }
    show(cur);
  }

  function toggleTheme() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const newTheme = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    
    // Cambiar icono
    const icon = document.getElementById('theme-icon');
    if (icon) {
      icon.setAttribute('data-lucide', newTheme === 'dark' ? 'moon' : 'sun');
      lucide.createIcons();
    }
    
    // Informar a todos los iframes
    document.querySelectorAll('.slide-frame').forEach(iframe => {
      iframe.contentWindow.postMessage({ type: 'theme-toggle', theme: newTheme }, '*');
    });
  }

  function handleKey(key) {
    let k = key.toLowerCase();
    if (['arrowleft', 'arrowup', 'arrowright', 'arrowdown', ' '].includes(k)) event.preventDefault();
    if (k === 'arrowleft' || k === 'arrowup') nav(-1);
    if (k === 'arrowright' || k === 'arrowdown' || k === ' ') nav(1);
    if (k === 'o') toggleOverview();
    if (k === 't') toggleTheme();
    if (k === 's') openPresenter();
    if (k === 'f') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => {});
      else document.exitFullscreen();
    }
  }

  document.addEventListener('keydown', e => handleKey(e.key));

  // Listen for messages from iframes (shortcuts that were captured inside the slide)
  window.addEventListener('message', e => {
    if (e.data && e.data.type === 'forward-key') {
      handleKey(e.data.key);
    }
  });

  // Listen for presenter sync
  bc.onmessage = e => {
    if (e.data.type === 'goto' && e.data.idx !== cur) {
      cur = e.data.idx;
      show(cur);
    }
    if (e.data.type === 'req_sync') {
      bc.postMessage({ type: 'goto', idx: cur });
    }
  };

  show(cur);

  function openPresenter() {
    window.open('presenter.html', 'presenter', 'width=1280,height=820,menubar=no,toolbar=no');
  }
</script>
