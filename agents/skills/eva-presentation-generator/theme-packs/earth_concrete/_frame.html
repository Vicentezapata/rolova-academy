<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS DEL PACK — ver theme-packs/TOKENS.md
   Earth Concrete: hormigón teñido, tinta negra y naranja de obra.
   Cero radio y cero sombra: las superficies son planas, casi
   traslúcidas, y todo se apoya en reglas y marcas de corte.
   ============================================================ */
:root{
  --bg:#c4bfb3; --bg2:#e8e3d8;
  --text:#1a1a1a; --text-sec:#3a3a3a; --text-ter:rgba(26,26,26,0.55);
  --strong:#1a1a1a;

  /* a1 es el naranja profundo porque los arquetipos lo usan como color de
     texto; el brillante vive en a2, para barras y puntos como en el original. */
  --a1:#d8541f; --a2:#ff6b35; --a3:#3a3a3a;
  --ok:#4a7c59; --warn:#b8730f; --err:#a83232;
  --a1-t:rgba(216,84,31,0.12); --a1-b:#d8541f;
  --a2-t:rgba(255,107,53,0.16); --a2-b:#ff6b35;
  --a3-t:rgba(58,58,58,0.10); --a3-b:#3a3a3a;
  --ok-t:rgba(74,124,89,0.12); --ok-b:#4a7c59;
  --warn-t:rgba(184,115,15,0.12); --warn-b:#b8730f;
  --err-t:rgba(168,50,50,0.12); --err-b:#a83232;

  --card-bg:rgba(255,255,255,0.40); --border:rgba(26,26,26,0.18);
  --bw:1px; --rule-h:2px;
  --radius:0px; --radius-lg:0px;
  --radius-sm:0px; --radius-pill:0px;
  --shadow:none; --shadow-sm:none;
  --inset-bg:#e8e3d8; --inset-border:rgba(26,26,26,0.18);
  --hi-bg:rgba(255,107,53,0.16);
  --hairline:rgba(26,26,26,0.12);
  --zebra:rgba(26,26,26,0.035);
  --thead-bg:#1a1a1a;

  --code-bg:rgba(255,255,255,0.55); --code-fg:#1a1a1a;
  --c-kw:#d8541f; --c-fn:#1a1a1a; --c-str:#4a7c59; --c-cm:rgba(26,26,26,0.45); --c-num:#b8730f;
  --display:'Inter Tight','Suisse Intl','Inter',sans-serif;
  --display-xl:'Inter Tight','Suisse Intl','Inter',sans-serif;
  --body:'Inter',-apple-system,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --serif:'Inter Tight','Inter',sans-serif;
  --title-shadow:none;
  --em-family:var(--display); --em-style:normal; --em-weight:700;
  --heavy:800;

  --mermaid-primary:#e8e3d8; --mermaid-text:#1a1a1a; --mermaid-border:#1a1a1a;
  --mermaid-line:#ff6b35; --mermaid-secondary:#d4cfc4; --mermaid-tertiary:#c4bfb3;
}
{{SHARED_CSS}}

/* Etiquetas de plano: mono, versalitas y tracking ancho. */
.tag{font-family:var(--mono);letter-spacing:0.18em;font-weight:600;text-transform:uppercase;}
.h1,.h2,.h3,h1,h2,h3{letter-spacing:-0.045em;}
.chip{font-family:var(--mono);letter-spacing:0.14em;text-transform:uppercase;}

/* ============================================================
   DECORACIONES DE FIRMA DEL PACK
   Grano de cemento + retícula 60px, mancha de humedad y las
   cuatro marcas de corte de imprenta.
   ============================================================ */
.deco-a{position:absolute;inset:0;z-index:0;pointer-events:none;
  border:1px solid rgba(26,26,26,0.18);
  background-image:
    radial-gradient(circle at 20% 30%, rgba(0,0,0,0.05) 1px, transparent 2px),
    radial-gradient(circle at 70% 60%, rgba(0,0,0,0.04) 1px, transparent 2px),
    radial-gradient(circle at 40% 80%, rgba(0,0,0,0.05) 1px, transparent 2px),
    radial-gradient(circle at 85% 18%, rgba(0,0,0,0.035) 1px, transparent 2px),
    linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
  background-size:30px 30px, 40px 40px, 50px 50px, 35px 35px, 60px 60px, 60px 60px;}

.deco-b{position:absolute;inset:0;z-index:0;pointer-events:none;background:{{STAIN}};}
.deco-b::before,.deco-b::after{content:'';position:absolute;width:14px;height:14px;}
.deco-b::before{top:26px;left:26px;border-top:1.5px solid #1a1a1a;border-left:1.5px solid #1a1a1a;}
.deco-b::after{top:26px;right:26px;border-top:1.5px solid #1a1a1a;border-right:1.5px solid #1a1a1a;}

.deco-c{position:absolute;inset:0;z-index:0;pointer-events:none;}
.deco-c::before,.deco-c::after{content:'';position:absolute;width:14px;height:14px;}
.deco-c::before{bottom:26px;left:26px;border-bottom:1.5px solid #1a1a1a;border-left:1.5px solid #1a1a1a;}
.deco-c::after{bottom:26px;right:26px;border-bottom:1.5px solid #1a1a1a;border-right:1.5px solid #1a1a1a;}

.slide{background:{{BG}};}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
</script>
</body>
</html>
