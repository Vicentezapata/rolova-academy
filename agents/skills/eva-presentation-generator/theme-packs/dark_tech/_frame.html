<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS DEL PACK — ver theme-packs/TOKENS.md
   Los arquetipos de _shared/ SOLO usan estas variables, por eso
   un pack nuevo es este archivo y nada más.
   ============================================================ */
:root{
  --bg:#050b1f; --bg2:#0a1f3d;
  --text:#ffffff; --text-sec:rgba(255,255,255,0.65); --text-ter:rgba(255,255,255,0.35);
  --strong:#ffffff;

  --a1:#22D3EE; --a2:#6366f1; --a3:#FDE047;
  --ok:#6ee7b7; --warn:#fcd34d; --err:#fca5a5;
  --a1-t:rgba(34,211,238,0.13); --a1-b:rgba(34,211,238,0.34);
  --a2-t:rgba(99,102,241,0.15); --a2-b:rgba(99,102,241,0.36);
  --a3-t:rgba(253,224,71,0.10); --a3-b:rgba(253,224,71,0.32);
  --ok-t:rgba(16,185,129,0.16); --ok-b:rgba(16,185,129,0.42);
  --warn-t:rgba(245,158,11,0.15); --warn-b:rgba(245,158,11,0.40);
  --err-t:rgba(239,68,68,0.14); --err-b:rgba(239,68,68,0.40);

  --card-bg:linear-gradient(135deg,rgba(34,211,238,0.08),rgba(99,102,241,0.04));
  --border:rgba(34,211,238,0.2); --bw:1px; --rule-h:1px;
  --radius:8px; --radius-lg:14px;
  --shadow:none; --shadow-sm:none;
  --inset-bg:rgba(255,255,255,0.04); --inset-border:rgba(255,255,255,0.08);
  --hi-bg:rgba(34,211,238,0.07);
  --hairline:rgba(255,255,255,0.06);
  --zebra:rgba(255,255,255,0.02);
  --thead-bg:rgba(99,102,241,0.18);

  --code-bg:rgba(2,6,23,0.75); --code-fg:#e2e8f0;
  --c-kw:#c084fc; --c-fn:#22D3EE; --c-str:#6ee7b7; --c-cm:rgba(255,255,255,0.35); --c-num:#fcd34d;

  --display:'Inter Tight','Inter',sans-serif;
  --display-xl:'Inter Tight','Inter',sans-serif;
  --body:'Inter','Inter Tight',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --serif:'Instrument Serif',Georgia,serif;
  --title-shadow:none;
  --em-family:var(--serif); --em-style:italic; --em-weight:400;
  --heavy:800;

  --mermaid-primary:#0f2540; --mermaid-text:#ffffff; --mermaid-border:#22D3EE;
  --mermaid-line:#6366f1; --mermaid-secondary:#1e1b4b; --mermaid-tertiary:#050b1f;
}
{{SHARED_CSS}}

/* ============================================================
   DECORACIONES DE FIRMA DEL PACK
   ============================================================ */
.deco-a{position:absolute;inset:0;z-index:0;background-image:radial-gradient(rgba(99,102,241,0.08) 1px,transparent 1px);background-size:40px 40px;}
.deco-b{position:absolute;width:400px;height:400px;border-radius:50%;background:rgba(14,165,233,0.2);filter:blur(75px);z-index:0;{{GLOW_POS}}}
.deco-c{display:none;}
.slide{background:radial-gradient(100% 80% at {{BG_ORIGIN}}, {{BG_TINT}} 0%, var(--bg) 80%);}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
</script>
</body>
</html>
