<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=Instrument+Serif:ital@0;1&family=Fraunces:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS DEL PACK — ver theme-packs/TOKENS.md
   Mocha Editorial: papel moca, serif en todo, cursiva Instrument
   en terracota y dos filetes que enmarcan la lectura.
   ============================================================ */
:root{
  --bg:#f3ebde; --bg2:#ede2d0;
  --text:#2a1810; --text-sec:#4a3a30; --text-ter:#8b5a3c;
  --strong:#1f1410;

  --a1:#c1502e; --a2:#8b5a3c; --a3:#4a3a30;
  --ok:#4a6b3a; --warn:#8b6a20; --err:#a3372a;
  --a1-t:rgba(193,80,46,0.08); --a1-b:#c1502e;
  --a2-t:rgba(139,90,60,0.09); --a2-b:#8b5a3c;
  --a3-t:rgba(74,58,48,0.08); --a3-b:#4a3a30;
  --ok-t:rgba(74,107,58,0.08); --ok-b:#4a6b3a;
  --warn-t:rgba(139,106,32,0.08); --warn-b:#8b6a20;
  --err-t:rgba(163,55,42,0.08); --err-b:#a3372a;

  --card-bg:rgba(237,226,208,0.55); --border:rgba(42,24,16,0.12);
  --bw:1px; --rule-h:1px;
  --radius:0px; --radius-lg:0px;
  --radius-sm:0px; --radius-pill:0px;
  --shadow:none; --shadow-sm:none;
  --inset-bg:#ede2d0; --inset-border:rgba(42,24,16,0.12);
  --hi-bg:rgba(193,80,46,0.08);
  --hairline:rgba(42,24,16,0.12);
  --zebra:rgba(42,24,16,0.03);
  --thead-bg:rgba(139,90,60,0.12);

  --code-bg:#ede2d0; --code-fg:#2a1810;
  --c-kw:#c1502e; --c-fn:#8b5a3c; --c-str:#4a6b3a; --c-cm:rgba(42,24,16,0.45); --c-num:#8b6a20;

  --display:'Source Serif 4','Tiempos Text',Georgia,serif;
  --display-xl:'Source Serif 4','Tiempos Text',Georgia,serif;
  --body:'Source Serif 4','Iowan Old Style',Georgia,serif;
  --mono:'JetBrains Mono',monospace;
  --serif:'Instrument Serif','Fraunces','Source Serif 4',Georgia,serif;
  --title-shadow:none;
  --em-family:var(--serif); --em-style:italic; --em-weight:400;
  --heavy:500;

  --mermaid-primary:#ede2d0; --mermaid-text:#2a1810; --mermaid-border:#c1502e;
  --mermaid-line:#8b5a3c; --mermaid-secondary:#f3ebde; --mermaid-tertiary:#ede2d0;
}
{{SHARED_CSS}}

/* Serif de peso ligero y muy aireado: es un ensayo, no un panel. */
.h1,.h2,.h3,h1,h2,h3{letter-spacing:-0.025em;}
.tag,.kicker{font-family:'Inter',sans-serif;font-weight:600;letter-spacing:0.25em;}
.slide-num{font-family:'JetBrains Mono',monospace;letter-spacing:0.08em;}
.chip,.meta-chip{font-family:'Inter',sans-serif;font-weight:500;letter-spacing:0.20em;text-transform:uppercase;}
.divider{background:rgba(42,24,16,0.12);opacity:1;}

/* ============================================================
   DECORACIONES DE FIRMA DEL PACK
   Grano de papel moca, dos filetes de lectura y el guion terracota.
   ============================================================ */
.deco-a{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:{{GRAIN}};}

/* Los dos filetes que acotan la mancha de texto arriba y abajo. */
.deco-b{position:absolute;left:80px;right:80px;top:18px;bottom:18px;z-index:0;pointer-events:none;
  border-top:1px solid rgba(42,24,16,0.12);
  border-bottom:1px solid rgba(42,24,16,0.12);}

/* El guion terracota de 24px que abre cada pieza. */
.deco-c{position:absolute;{{DASH}}width:24px;height:1.5px;z-index:0;pointer-events:none;
  background:#c1502e;}

.slide{background:{{BG}};}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
</script>
</body>
</html>
