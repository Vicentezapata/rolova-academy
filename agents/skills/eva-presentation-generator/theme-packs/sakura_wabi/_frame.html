<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS DEL PACK — ver theme-packs/TOKENS.md
   Sakura Wabi: washi, serif ligero en todo, dos hairlines y un
   único punto de sakura. El vacío es el material principal.
   ============================================================ */
:root{
  --bg:#f5f0e8; --bg2:#ede6da;
  --text:#2c2826; --text-sec:#4a423d; --text-ter:#7a6f66;
  --strong:#2c2826;

  /* El sakura #d97a87 se queda en 2.9:1 sobre el washi: vive en los
     rellenos (--a1-b) y el token de texto es el rosa profundo. */
  --a1:#b8535f; --a2:#7a6f66; --a3:#4a423d;
  --ok:#5c7a52; --warn:#9c8340; --err:#b8535f;
  --a1-t:rgba(217,122,135,0.12); --a1-b:#d97a87;
  --a2-t:rgba(122,111,102,0.09); --a2-b:#7a6f66;
  --a3-t:rgba(74,66,61,0.08); --a3-b:#4a423d;
  --ok-t:rgba(92,122,82,0.09); --ok-b:#5c7a52;
  --warn-t:rgba(156,131,64,0.09); --warn-b:#c9b896;
  --err-t:rgba(184,83,95,0.09); --err-b:#b8535f;

  --card-bg:rgba(237,230,218,0.45); --border:rgba(44,40,38,0.18);
  --bw:1px; --rule-h:1px;
  --radius:3px; --radius-lg:3px;
  --radius-sm:3px; --radius-pill:3px;
  --shadow:none; --shadow-sm:none;
  --inset-bg:#ede6da; --inset-border:rgba(44,40,38,0.14);
  --hi-bg:rgba(217,122,135,0.10);
  --hairline:rgba(44,40,38,0.18);
  --zebra:rgba(44,40,38,0.028);
  --thead-bg:rgba(201,184,150,0.22);

  --code-bg:#ede6da; --code-fg:#2c2826;
  --c-kw:#b8535f; --c-fn:#4a423d; --c-str:#5c7a52; --c-cm:#7a6f66; --c-num:#9c8340;

  --display:'Noto Serif JP','Source Han Serif SC','Hiragino Mincho ProN',serif;
  --display-xl:'Noto Serif JP','Source Han Serif SC','Hiragino Mincho ProN',serif;
  --body:'Noto Serif JP','Source Han Serif SC','Hiragino Mincho ProN',serif;
  --mono:'JetBrains Mono',monospace;
  --serif:'Noto Serif JP',Georgia,serif;
  --title-shadow:none;
  --em-family:var(--serif); --em-style:normal; --em-weight:500;
  --heavy:400;

  --mermaid-primary:#ede6da; --mermaid-text:#2c2826; --mermaid-border:#d97a87;
  --mermaid-line:#7a6f66; --mermaid-secondary:#f5f0e8; --mermaid-tertiary:#ede6da;
}
{{SHARED_CSS}}

/* Peso 400 en el display: en wabi-sabi nada se impone. */
.h1,.h2,.h3,h1,h2,h3{letter-spacing:0.06em;font-weight:400;}
.tag,.kicker{font-family:'Inter',sans-serif;font-weight:500;letter-spacing:0.42em;}
.slide-num{font-family:'Inter',sans-serif;font-weight:400;letter-spacing:0.40em;}
.chip,.meta-chip{font-family:'Inter',sans-serif;font-weight:400;letter-spacing:0.30em;text-transform:uppercase;}
.divider{background:rgba(44,40,38,0.18);opacity:1;}

/* ============================================================
   DECORACIONES DE FIRMA DEL PACK
   Grano de washi, dos hairlines de caja y el punto de sakura
   con su halo, más el sello al pie.
   ============================================================ */
.deco-a{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    {{WASH}},
    radial-gradient(circle at 30% 60%, rgba(201,184,150,0.06) 0px, transparent 1px),
    radial-gradient(circle at 70% 40%, rgba(201,184,150,0.05) 0px, transparent 1px);
  background-size:auto, auto, 7px 7px, 11px 11px;}

.deco-b{position:absolute;left:80px;right:80px;top:14px;bottom:14px;z-index:0;pointer-events:none;
  border-top:1px solid rgba(44,40,38,0.18);
  border-bottom:1px solid rgba(44,40,38,0.18);}
/* Sello al pie derecho, por encima de la banda de numeración. */
.deco-b::after{content:'';position:absolute;right:0;bottom:50px;width:34px;height:34px;
  border:1px solid #d97a87;border-radius:3px;opacity:0.85;}

/* El punto de sakura con su sombra difusa: el único gesto de color. */
.deco-c{position:absolute;{{PETAL}}width:22px;height:22px;border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 35% 32%, #ffc4d0 0%, #ffb7c5 38%, #d97a87 100%);
  opacity:0.92;}
.deco-c::before{content:'';position:absolute;left:-8px;top:-6px;width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(217,122,135,0.12) 0%, transparent 65%);}

.slide{background:{{BG}};}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
</script>
</body>
</html>
