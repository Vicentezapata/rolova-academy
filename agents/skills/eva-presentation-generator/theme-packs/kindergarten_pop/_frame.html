<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS DEL PACK — ver theme-packs/TOKENS.md
   Kindergarten Pop: crema cálida, cartas muy redondeadas (28px)
   con anillo blanco interior, y blobs pastel de fondo.
   Los pasteles del original viven en los rellenos (-t/-b);
   los tokens de texto usan versiones profundizadas.
   ============================================================ */
:root{
  --bg:#fff8e7; --bg2:#ffeed4;
  --text:#2a2a3a; --text-sec:#6a6a7a; --text-ter:rgba(42,42,58,0.45);
  --strong:#2a2a3a;

  --a1:#ff7a92; --a2:#0aa87f; --a3:#c98a00;
  --ok:#0aa87f; --warn:#c98a00; --err:#e05a70;
  --a1-t:#ffe0e6; --a1-b:#ffb6c1;
  --a2-t:#d6f8ec; --a2-b:#06d6a0;
  --a3-t:#fff1c9; --a3-b:#ffd166;
  --ok-t:#d6f8ec; --ok-b:#06d6a0;
  --warn-t:#fff1c9; --warn-b:#ffd166;
  --err-t:#ffe0e6; --err-b:#ff7a92;

  --card-bg:#fffaf0; --border:rgba(255,255,255,0.9);
  --bw:1.5px; --rule-h:4px;
  --radius:28px; --radius-lg:32px;
  --shadow:0 10px 30px rgba(255,200,130,0.18), inset 0 0 0 1.5px rgba(255,255,255,0.9);
  --shadow-sm:0 6px 18px rgba(255,200,130,0.16);
  --inset-bg:#d6efff; --inset-border:rgba(255,255,255,0.9);
  --hi-bg:#fff1c9;
  --hairline:rgba(42,42,58,0.10);
  --zebra:rgba(42,42,58,0.03);
  --thead-bg:#d6efff;

  --code-bg:#fffaf0; --code-fg:#2a2a3a;
  --c-kw:#ff7a92; --c-fn:#0aa87f; --c-str:#3a7fb5; --c-cm:rgba(42,42,58,0.45); --c-num:#c98a00;

  --display:'Quicksand','Nunito',sans-serif;
  --display-xl:'Quicksand','Nunito',sans-serif;
  --body:'Nunito','Quicksand',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --serif:'Quicksand','Nunito',sans-serif;
  --title-shadow:none;
  --em-family:var(--display); --em-style:normal; --em-weight:700;
  --heavy:700;

  --mermaid-primary:#fffaf0; --mermaid-text:#2a2a3a; --mermaid-border:#ff7a92;
  --mermaid-line:#87ceeb; --mermaid-secondary:#ffeed4; --mermaid-tertiary:#fff8e7;
}
{{SHARED_CSS}}

/* Todo redondea: las píldoras y los badges son parte del tono. */
.tag{letter-spacing:0.18em;font-family:var(--display);font-weight:700;}
.h1,.h2,.h3{letter-spacing:-0.015em;}

/* ============================================================
   DECORACIONES DE FIRMA DEL PACK
   Blobs pastel difusos y una estrella.
   ============================================================ */
.deco-a{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-repeat:no-repeat;
  background-image:
    radial-gradient(circle at 35% 35%, #6ce5c0 0%, #06d6a0 80%, transparent 81%),
    radial-gradient(circle at 35% 35%, #ffe6a0 0%, #ffd166 80%, transparent 81%);
  background-size:70px 70px, 90px 90px;
  background-position:calc(100% - 240px) 280px, calc(100% + 28px) 180px;
  opacity:.45;}

.deco-b{position:absolute;border-radius:50%;z-index:0;pointer-events:none;{{BLOB}}}

.deco-c{position:absolute;z-index:1;pointer-events:none;font-size:26px;line-height:1;{{STAR}}}
.deco-c::before{content:'\2B50';}

.slide{background:{{BG}};}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
</script>
</body>
</html>
