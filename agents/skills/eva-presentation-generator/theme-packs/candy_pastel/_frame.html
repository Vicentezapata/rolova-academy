<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Fraunces:ital,wght@0,400;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS DEL PACK — ver theme-packs/TOKENS.md
   Candy Pastel: crema cálida, display Playfair en cursiva,
   radio grande (24px) y cartas de vidrio blanco con sombra rosa.
   Los pasteles del original son demasiado claros para texto, así
   que viven en los rellenos (-t) y los tokens de texto usan
   versiones profundizadas de esos mismos tonos.
   ============================================================ */
:root{
  --bg:#fff5f0; --bg2:#fbe9df;
  --text:#4a2c2a; --text-sec:rgba(74,44,42,0.62); --text-ter:rgba(74,44,42,0.42);
  --strong:#4a2c2a;

  --a1:#e89bb4; --a2:#7bb0d4; --a3:#c9a227;
  --ok:#5c9a68; --warn:#b8912e; --err:#c25f6e;
  --a1-t:rgba(248,187,208,0.42); --a1-b:#f8bbd0;
  --a2-t:rgba(179,229,252,0.45); --a2-b:#b3e5fc;
  --a3-t:rgba(255,245,157,0.50); --a3-b:#fff59d;
  --ok-t:rgba(200,230,201,0.50); --ok-b:#c8e6c9;
  --warn-t:rgba(255,245,157,0.50); --warn-b:#fff59d;
  --err-t:rgba(232,155,180,0.30); --err-b:#e89bb4;

  --card-bg:rgba(255,255,255,0.55); --border:rgba(255,255,255,0.85);
  --bw:1px; --rule-h:1px;
  --radius:24px; --radius-lg:28px;
  --shadow:0 10px 26px rgba(232,155,180,0.10), inset 0 1px 0 rgba(255,255,255,0.9);
  --shadow-sm:0 6px 16px rgba(232,155,180,0.10);
  --inset-bg:rgba(255,255,255,0.62); --inset-border:rgba(255,255,255,0.9);
  --hi-bg:rgba(248,187,208,0.30);
  --hairline:rgba(74,44,42,0.14);
  --zebra:rgba(74,44,42,0.03);
  --thead-bg:rgba(248,187,208,0.28);

  --code-bg:rgba(255,255,255,0.7); --code-fg:#4a2c2a;
  --c-kw:#b06a86; --c-fn:#5a86a8; --c-str:#5c9a68; --c-cm:rgba(74,44,42,0.42); --c-num:#b8912e;

  --display:'Playfair Display','Fraunces',Georgia,serif;
  --display-xl:'Playfair Display','Fraunces',Georgia,serif;
  --body:'Inter',-apple-system,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --serif:'Playfair Display','Fraunces',Georgia,serif;
  --title-shadow:none;
  --em-family:var(--serif); --em-style:italic; --em-weight:500;
  --heavy:500;

  --mermaid-primary:#ffffff; --mermaid-text:#4a2c2a; --mermaid-border:#e89bb4;
  --mermaid-line:#7bb0d4; --mermaid-secondary:#fbe9df; --mermaid-tertiary:#fff5f0;
}
{{SHARED_CSS}}

/* Toda la tipografía de display va en cursiva: es la firma del tema. */
.h1,.h2,.h3,.display,.kicker,.card-title,h1,h2,h3{font-style:italic;}
.tag{letter-spacing:0.34em;font-weight:600;}

/* ============================================================
   DECORACIONES DE FIRMA DEL PACK
   Motas macaron, orbe brillante y burbuja de azúcar.
   ============================================================ */
.deco-a{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.6;
  background-repeat:no-repeat;
  background-image:
    radial-gradient(circle, #fff59d 46%, transparent 47%),
    radial-gradient(circle, #e1bee7 46%, transparent 47%),
    radial-gradient(circle, #b3e5fc 46%, transparent 47%),
    radial-gradient(circle, #e89bb4 46%, transparent 47%),
    radial-gradient(circle, #c8e6c9 46%, transparent 47%);
  background-size:14px 14px, 8px 8px, 10px 10px, 6px 6px, 12px 12px;
  background-position:
    calc(100% - 240px) 70px,
    calc(100% - 110px) 180px,
    70px calc(100% - 280px),
    38% 360px,
    calc(100% - 320px) calc(100% - 120px);}

.deco-b{position:absolute;width:230px;height:230px;border-radius:50%;z-index:0;pointer-events:none;
  box-shadow:0 18px 40px rgba(232,155,180,0.28), inset 0 -12px 24px rgba(74,44,42,0.05), inset 0 10px 20px rgba(255,255,255,0.45);
  {{ORB}}}

.deco-c{position:absolute;width:26px;height:26px;border-radius:50%;z-index:1;pointer-events:none;
  background:#fff59d;
  box-shadow:0 6px 14px rgba(74,44,42,0.08), inset 0 -3px 5px rgba(74,44,42,0.05), inset 0 2px 4px rgba(255,255,255,0.5);
  {{BUBBLE}}}

.slide{background:{{BG}};}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
</script>
</body>
</html>
