<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<title>{{SLIDE_TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS DEL PACK — ver theme-packs/TOKENS.md
   Nocturne Violet: noche violeta, aurora desenfocada, vidrio
   morado y cursiva Instrument como contrapunto al sans apretado.
   ============================================================ */
:root{
  --bg:#0a0612; --bg2:#1a0d2e;
  --text:#ffffff; --text-sec:rgba(255,255,255,0.65); --text-ter:rgba(255,255,255,0.45);
  --strong:#ffffff;

  --a1:#9b64ff; --a2:#c4a8ff; --a3:#6d3df0;
  --ok:#7ee0a8; --warn:#ffcc6b; --err:#ff7a8a;
  --a1-t:rgba(155,100,255,0.14); --a1-b:rgba(155,100,255,0.55);
  --a2-t:rgba(196,168,255,0.12); --a2-b:rgba(196,168,255,0.45);
  --a3-t:rgba(109,61,240,0.16); --a3-b:rgba(109,61,240,0.55);
  --ok-t:rgba(126,224,168,0.12); --ok-b:rgba(126,224,168,0.45);
  --warn-t:rgba(255,204,107,0.12); --warn-b:rgba(255,204,107,0.45);
  --err-t:rgba(255,122,138,0.12); --err-b:rgba(255,122,138,0.45);

  /* Vidrio violeta: el desenfoque de fondo es la firma, no el color. */
  --card-bg:rgba(155,100,255,0.10); --border:rgba(155,100,255,0.30);
  --bw:1px; --rule-h:1px;
  --radius:12px; --radius-lg:14px;
  --shadow:0 12px 40px -12px rgba(155,100,255,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
  --shadow-sm:0 8px 24px -10px rgba(155,100,255,0.30), inset 0 1px 0 rgba(255,255,255,0.06);
  --inset-bg:rgba(196,168,255,0.07); --inset-border:rgba(196,168,255,0.18);
  --hi-bg:rgba(155,100,255,0.16);
  --hairline:rgba(196,168,255,0.16);
  --zebra:rgba(196,168,255,0.035);
  --thead-bg:rgba(155,100,255,0.18);

  --code-bg:rgba(10,6,18,0.72); --code-fg:#ffffff;
  --c-kw:#c4a8ff; --c-fn:#9b64ff; --c-str:#7ee0a8; --c-cm:rgba(255,255,255,0.45); --c-num:#ffcc6b;

  --display:'Inter Tight','Inter',-apple-system,sans-serif;
  --display-xl:'Inter Tight','Inter',-apple-system,sans-serif;
  --body:'Inter',-apple-system,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --serif:'Instrument Serif','Editorial New',Georgia,serif;
  --title-shadow:none;
  --em-family:var(--serif); --em-style:italic; --em-weight:400;
  --heavy:700;

  --mermaid-primary:#1a0d2e; --mermaid-text:#ffffff; --mermaid-border:#9b64ff;
  --mermaid-line:#c4a8ff; --mermaid-secondary:#0a0612; --mermaid-tertiary:#150a26;
}
{{SHARED_CSS}}

.h1,.h2,.h3,h1,h2,h3{letter-spacing:-0.045em;}
.tag,.kicker{font-family:var(--body);font-weight:600;letter-spacing:0.20em;}
.card{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}

/* ============================================================
   DECORACIONES DE FIRMA DEL PACK
   Aurora desenfocada, retícula de 80px, esquinas y filete inferior.
   ============================================================ */
.deco-a{position:absolute;inset:0;z-index:0;pointer-events:none;
  filter:blur(60px);
  background:{{AURORA}};}

.deco-b{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(196,168,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(196,168,255,0.025) 1px, transparent 1px);
  background-size:80px 80px;}
.deco-b::before,.deco-b::after{content:'';position:absolute;width:24px;height:24px;}
.deco-b::before{top:14px;left:14px;border-top:1px solid rgba(155,100,255,0.45);border-left:1px solid rgba(155,100,255,0.45);}
.deco-b::after{bottom:14px;right:14px;border-bottom:1px solid rgba(155,100,255,0.45);border-right:1px solid rgba(155,100,255,0.45);}

/* Filete de luz al pie: transparente, violeta, lila, violeta, transparente. */
.deco-c{position:absolute;left:0;right:0;bottom:0;height:1px;z-index:6;pointer-events:none;opacity:0.6;
  background:linear-gradient(90deg, transparent, #9b64ff 35%, #c4a8ff 50%, #9b64ff 65%, transparent);}

.slide{background:{{BG}};}

{{EXTRA_CSS}}
</style>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>
<main class="slide" role="region" aria-label="{{SLIDE_TITLE}}">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="deco-c" aria-hidden="true"></div>
{{BODY}}
  <div class="slide-num">{{SLIDE_NUM}} / {{TOTAL}}</div>
</main>
<script>
  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
    window.parent.postMessage({ type: 'forward-key', key: e.key }, '*');
  });
</script>
</body>
</html>
