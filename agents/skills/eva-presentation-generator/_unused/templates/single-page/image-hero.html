<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><title>Image Hero</title>
<link href="../../assets/fonts.css" rel="stylesheet"/>
<link href="../../assets/base.css" rel="stylesheet"/>
<link href="../../assets/themes/minimal-white.css" id="theme-link" rel="stylesheet"/>
<link href="../../assets/animations/animations.css" rel="stylesheet"/>
<style>
.hero-container{display:grid;grid-template-columns:1fr 1fr;gap:0;height:100%;min-height:580px}
.hero-text{padding:60px 50px;display:flex;flex-direction:column;justify-content:center}
.hero-text .overline{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.hero-text h1{font-size:44px;font-weight:800;line-height:1.1;letter-spacing:-.02em;margin-bottom:20px}
.hero-text .lede{font-size:18px;color:var(--text-2);line-height:1.6;max-width:480px}
.hero-text .cta-row{margin-top:32px;display:flex;gap:16px;align-items:center}
.hero-text .btn-primary{padding:12px 28px;background:var(--accent);color:#fff;border-radius:8px;font-weight:600;font-size:15px;border:none;cursor:pointer}
.hero-text .btn-ghost{padding:12px 28px;background:transparent;color:var(--text-1);border:1px solid var(--border);border-radius:8px;font-weight:600;font-size:15px;cursor:pointer}
.hero-image{position:relative;overflow:hidden;background:var(--surface-2)}
.hero-image img{width:100%;height:100%;object-fit:cover}
.hero-image .overlay{position:absolute;inset:0;background:linear-gradient(to right,var(--bg) 0%,transparent 30%)}
</style>
</head><body class="single">
<div class="deck"><section class="slide is-active" data-title="Image Hero">
<div class="hero-container">
  <div class="hero-text anim-stagger-list">
    <span class="overline">{{ label }}</span>
    <h1 class="anim-fade-up" data-anim="fade-up">{{ title }}</h1>
    <p class="lede">{{ text }}</p>
    <div class="cta-row">
      <button class="btn-primary">{{ cta_primary }}</button>
      <button class="btn-ghost">{{ cta_secondary }}</button>
    </div>
  </div>
  <div class="hero-image anim-fade-right" data-anim="fade-right">
    <img src="{{ image_src }}" alt="{{ image_alt }}"/>
    <div class="overlay"></div>
  </div>
</div>
</section></div>
<script src="../../assets/runtime.js"></script>
</body></html>
